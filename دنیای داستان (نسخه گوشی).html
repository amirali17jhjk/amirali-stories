    summary: "وقتی مدیر مدرسه برای یک روز غایب می‌شود، دانش‌آموزی خوش‌شانس به‌عنوان مدیر موقت انتخاب می‌شود؛ اما قوانین تازهٔ او خیلی زود مدرسه را به هم می‌ریزد.",
    body: `
همه‌چیز از یک صبح معمولی دوشنبه شروع شد؛ صبحی که دانش‌آموزان با چهره‌هایی خواب‌آلود وارد مدرسه می‌شدند و امیدوار بودند زنگ اول به هر دلیلی تشکیل نشود.

آرین، دانش‌آموز کلاس نهم، با کیف سنگینی که انگار داخلش چند آجر گذاشته بودند، وارد حیاط شد.

دوستش، مهدی، پرسید:
«چرا این‌قدر دیر اومدی؟»

آرین گفت:
«چون ساعت زنگ‌دارم تصمیم گرفته بود امروز به جای زنگ زدن، خودش بخوابه.»

مهدی خندید.
«بازم خاموشش کردی؟»

«نه، این بار خودش خاموش شده بود. فکر کنم از درس ریاضی خسته شده.»

در همان لحظه، ناظم مدرسه با بلندگو اعلام کرد:
«همهٔ دانش‌آموزان به سالن اجتماعات مراجعه کنند. اطلاعیهٔ مهمی داریم.»

دانش‌آموزان با نگرانی به یکدیگر نگاه کردند. هر وقت در مدرسه اطلاعیهٔ مهمی اعلام می‌شد، معمولاً خبری از امتحان، تغییر برنامه یا یک قانون تازه بود.

چند دقیقه بعد، همه در سالن جمع شدند.

ناظم پشت میکروفن ایستاد و گفت:
«مدیر مدرسه امروز به دلیل یک جلسهٔ ضروری خارج از مدرسه حضور ندارند. بنابراین، تصمیم گرفته‌ایم برای آشنایی بیشتر دانش‌آموزان با مسئولیت‌های مدیریتی، یک مدیر دانش‌آموزی انتخاب کنیم.»

چند نفر زیر لب خندیدند.

ناظم ادامه داد:
«این دانش‌آموز برای یک روز، با نظارت کادر مدرسه، پیشنهادهای خود را برای بهتر شدن محیط آموزشی ارائه خواهد کرد.»

سپس نام آرین را خواند.

آرین ابتدا فکر کرد اشتباه شنیده است.

مهدی آرام گفت:
«تبریک می‌گم، جناب مدیر!»

آرین روی صحنه رفت. ناظم یک کارت شناسایی موقت و یک دفترچه به او داد.

«یادت باشه، مسئولیت مهمیه. باید با معلم‌ها و کارکنان همکاری کنی.»

آرین با جدیت گفت:
«نگران نباشید. من مدرسه رو متحول می‌کنم.»

مهدی از میان جمعیت فریاد زد:
«اول از همه زنگ تفریح رو یک ساعت کن!»

دانش‌آموزان خندیدند.

آرین همان لحظه تصمیم گرفت نخستین قانونش را اجرا کند.

او در دفتر مدیر نشست و به دفترچهٔ پیشنهادها نگاه کرد. روی نخستین صفحه نوشت:

«قانون شمارهٔ یک: دانش‌آموزان باید با انرژی وارد مدرسه شوند.»

چند ثانیه فکر کرد و زیرش افزود:

«قانون شمارهٔ دو: برای افزایش انرژی، زنگ تفریح ده دقیقه بیشتر می‌شود.»

او برگه را به ناظم نشان داد.

ناظم گفت:
«این فقط یک پیشنهاد است. باید درباره‌اش صحبت کنیم.»

آرین گفت:
«باشه. پس تا وقتی صحبت می‌کنیم، زنگ تفریح ده دقیقه بیشتره.»

ناظم چیزی نگفت، چون دقیقاً نمی‌دانست باید به این منطق چه جوابی بدهد.

آرین به حیاط رفت و با بلندگو اعلام کرد:
«دانش‌آموزان عزیز! از امروز زنگ تفریح کمی طولانی‌تر خواهد بود.»

صدای شادی از حیاط بلند شد.

اما این تازه شروع ماجرا بود.

آرین برای زنگ بعدی تصمیم گرفت برنامهٔ صبحگاهی را تغییر دهد. به جای اعلام اخبار مدرسه، از بلندگو موسیقی بی‌کلام پخش کرد و گفت:
«هدف ما اینه که دانش‌آموزان با آرامش بیشتری درس بخونن.»

معلم علوم از کلاس بیرون آمد و پرسید:
«این موسیقی از کجا میاد؟»

آرین با افتخار گفت:
«برنامهٔ جدید مدیریت.»

معلم جواب داد:
«خیلی خوب. حالا برنامهٔ جدید مدیریت می‌تونه موسیقی رو قطع کنه تا من صدای خودم رو بشنوم؟»

آرین فوراً موسیقی را خاموش کرد و گفت:
«بازخورد شما ثبت شد.»

بعد از آن، او تصمیم گرفت غذای بوفه را بررسی کند. وقتی دید بیشتر دانش‌آموزان از ساندویچ‌های تکراری شکایت دارند، به مسئول بوفه پیشنهاد داد منوی تازه‌ای تهیه کند.

مسئول بوفه گفت:
«چه پیشنهادی داری؟»

آرین دفترچه‌اش را باز کرد.

«ساندویچ مخصوص مدیر، پیتزای دانش‌آموزی و نوشیدنی انرژی‌زای امتحانات.»

مسئول بوفه پرسید:
«نوشیدنی انرژی‌زای امتحانات چه طعمی داره؟»

آرین گفت:
«طعم موفقیت.»

مسئول بوفه سرش را تکان داد.
«ما فعلاً فقط آب‌میوه داریم.»

آرین تصمیم گرفت روی برچسب آب‌میوه‌ها بنویسد: «نوشیدنی موفقیت؛ با طعم پرتقال».

تا ظهر، محبوبیت او در مدرسه به اوج رسیده بود. دانش‌آموزان برای پیشنهاد دادن صف کشیده بودند.

یکی می‌خواست تکلیف‌ها کمتر شود. دیگری درخواست داشت امتحان‌ها فقط روزهای پنجشنبه برگزار شوند. دانش‌آموزی هم پیشنهاد داده بود کلاس ورزش در تمام روزهای هفته باشد.

آرین گفت:
«پیشنهادها رو بررسی می‌کنیم.»

مهدی پرسید:
«یعنی قبول می‌کنی؟»

آرین جواب داد:
«یعنی بررسی می‌کنیم که چطور می‌تونیم قبول کنیم.»

در همین هنگام، معلم ریاضی وارد دفتر شد.

«آرین، شنیده‌ام برنامهٔ زنگ‌ها را تغییر داده‌ای.»

آرین با احتیاط گفت:
«فقط ده دقیقه به زنگ تفریح اضافه کردم.»

معلم گفت:
«پس ده دقیقه از کدام قسمت روز کم شده؟»

آرین به دفترچه نگاه کرد.

«از... زمان انتظار برای زنگ تفریح؟»

معلم ابروهایش را بالا برد.

«این جمله را در کلاس هم توضیح بده. شاید به یک مبحث جدید در ریاضی تبدیلش کنیم.»

آرین احساس کرد مدیریت کمی دشوارتر از چیزی است که تصور می‌کرد.

با این حال، هنوز یک برنامهٔ مهم داشت: برگزاری جلسه‌ای برای شنیدن مشکلات دانش‌آموزان.

او در سالن اجتماعات صندلی‌ها را مرتب کرد و اعلام کرد هر دانش‌آموز می‌تواند آزادانه صحبت کند.

اولین نفر گفت:
«کلاس ما پنجره‌ای داره که بسته نمی‌شه.»

دومی گفت:
«ساعت کلاس ما همیشه پنج دقیقه جلوتره.»

سومی گفت:
«هر بار که می‌ریم آزمایشگاه، کسی ماژیک تخته رو پیدا نمی‌کنه.»

آرین همه را یادداشت کرد و قول داد مشکلات را پیگیری کند.

در پایان جلسه، یکی از دانش‌آموزان بلند شد و پرسید:
«آقای مدیر، مشکل اصلی ما اینه که هیچ‌کس به حرف‌هامون گوش نمی‌ده. امروز شما گوش دادید. می‌شه این برنامه ادامه پیدا کنه؟»

آرین برای نخستین بار در آن روز، شوخی نکرد.

گفت:
«فکر می‌کنم این بهترین پیشنهادی بود که امروز شنیدم.»

او تصمیم گرفت جلسهٔ پیشنهادها هر ماه یک بار برگزار شود و فهرست مشکلات به مدیر اصلی تحویل داده شود.

وقتی زنگ آخر به صدا درآمد، آرین به دفتر برگشت. ناظم منتظرش بود.

«خب، مدیر یک‌روزه! روزت چطور بود؟»

آرین روی صندلی نشست و آه کشید.

«فکر می‌کردم مدیریت یعنی تصمیم گرفتن. ولی بیشترش گوش دادن، هماهنگ کردن و حل کردن مشکلاته.»

ناظم لبخند زد.

«حالا فهمیدی چرا مدیر مدرسه همیشه دفترچه همراهشه؟»

آرین دفترچهٔ خودش را بالا گرفت.

«بله. چون اگر همهٔ پیشنهادها رو حفظ کنه، احتمالاً تا فردا مغزش درخواست مرخصی می‌ده.»

ناظم خندید و کارت شناسایی موقت را از او گرفت.

چند لحظه بعد، مدیر اصلی وارد دفتر شد. ناظم خلاصهٔ اتفاقات روز را تعریف کرد و دفترچهٔ پیشنهادهای آرین را به او داد.

مدیر صفحات را ورق زد. از قانون طولانی شدن زنگ تفریح گرفته تا منوی جدید بوفه و جلسهٔ پیشنهادها، همه‌چیز را با دقت خواند.

سپس به آرین گفت:
«بعضی پیشنهادهایت نیاز به بررسی دارند، اما یک کار بسیار خوب انجام دادی.»

آرین پرسید:
«کدوم کار؟»

مدیر پاسخ داد:
«اینکه مشکلات دانش‌آموزان را شنیدی و آن‌ها را یادداشت کردی. از ماه آینده، جلسهٔ پیشنهادها را به‌صورت آزمایشی برگزار می‌کنیم.»

آرین خوشحال شد.

«یعنی دوباره مدیر می‌شم؟»

مدیر لبخند زد.

«نه، فعلاً همان دانش‌آموزی.»

آرین سرش را پایین انداخت و گفت:
«باشه. فقط می‌تونم یک درخواست آخر داشته باشم؟»

مدیر پرسید:
«چی؟»

آرین با جدیت گفت:
«لطفاً به ساعت زنگ‌دار من مرخصی ندید. فردا امتحان ریاضی دارم.»

مدیر خندید.

«این یکی دیگه به مدیریت مدرسه مربوط نیست.»

آرین از دفتر بیرون رفت و مهدی را در حیاط پیدا کرد.

مهدی پرسید:
«خب، فردا دوباره زنگ تفریح طولانی داریم؟»

آرین گفت:
«نه. ولی از ماه بعد جلسهٔ پیشنهادها داریم.»

مهدی کمی فکر کرد.

«می‌تونیم پیشنهاد بدیم امتحان‌ها حذف بشن؟»

آرین لبخند زد.

«می‌تونیم پیشنهاد بدیم. اما اگه قبول نکردن، حداقل یاد می‌گیریم چطور یک پیشنهاد خوب بنویسیم.»

مهدی گفت:
«پس پیشنهاد اول من اینه که فردا به جای امتحان، دربارهٔ پیشنهادنویسی امتحان بدیم!»

آرین خندید.

آن دو از مدرسه بیرون رفتند؛ درحالی‌که آرین هنوز دفترچهٔ پیشنهادهایش را در دست داشت و مطمئن بود مدیریت مدرسه، با تمام دردسرهایش، از حل کردن تکالیف ریاضی هم سخت‌تر است.
`
},
];

let activeFilter = "همه";
let favorites = JSON.parse(localStorage.getItem("amiraliStoryFavorites") || "[]");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderStories() {
  const search = document.getElementById("search").value.trim().toLowerCase();
  const genre = document.getElementById("genre").value;
  const onlyFavorites = activeFilter === "علاقه‌مندی‌ها";

  const filtered = stories.filter(story => {
    const matchesSearch =
      (story.title + " " + story.summary + " " + story.body)
      .toLowerCase().includes(search);
    const matchesGenre = genre === "همه" || story.genre === genre;
    const matchesFavorite = !onlyFavorites || favorites.includes(story.id);
    return matchesSearch && matchesGenre && matchesFavorite;
  });

  document.getElementById("count").textContent =
    "تعداد داستان‌های این بخش: " + stories.length;

  const container = document.getElementById("stories");

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty">داستانی پیدا نشد. عبارت جست‌وجو یا فیلتر را تغییر بده.</div>';
    return;
  }

  container.innerHTML = filtered.map(story => `
    <article class="story-card">
      <div class="emoji">${escapeHTML(story.emoji)}</div>
      <span class="tag">${escapeHTML(story.genre)}</span>
      <h3>${escapeHTML(story.title)}</h3>
      <p>${escapeHTML(story.summary)}</p>
      <div class="actions">
        <button onclick="openStory(${story.id})">📖 مطالعه</button>
        <button class="favorite" onclick="toggleFavorite(${story.id})">
          ${favorites.includes(story.id) ? "♥ ذخیره‌شده" : "♡ علاقه‌مندی"}
        </button>
      </div>
    </article>
  `).join("");
}

function openStory(id) {
  const story = stories.find(item => item.id === id);
  if (!story) return;

  document.getElementById("readerTitle").textContent = story.title;
  document.getElementById("readerGenre").textContent = story.genre;

  const textContainer = document.getElementById("readerText");
  textContainer.replaceChildren();

  story.body.split(/\n\s*\n/).forEach(paragraph => {
    const p = document.createElement("p");
    p.textContent = paragraph;
    textContainer.appendChild(p);
  });

  document.getElementById("reader").style.display = "block";
  document.getElementById("reader").scrollIntoView({ behavior: "smooth" });
}

function closeReader() {
  document.getElementById("reader").style.display = "none";
  document.getElementById("stories").scrollIntoView({ behavior: "smooth" });
}

function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem("amiraliStoryFavorites", JSON.stringify(favorites));
  renderStories();
}

function filterGenre(genre) {
  activeFilter = "همه";
  document.getElementById("genre").value = genre;
  renderStories();
  document.getElementById("stories").scrollIntoView({ behavior: "smooth" });
}

function showAll() {
  activeFilter = "همه";
  document.getElementById("genre").value = "همه";
  document.getElementById("search").value = "";
  renderStories();
}

function showFavorites() {
  activeFilter = "علاقه‌مندی‌ها";
  renderStories();
  document.getElementById("stories").scrollIntoView({ behavior: "smooth" });
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

renderStories();
</script>
