یکی از کارکنان گفت: «پس خود گربه نماد کسی است که محصول را می‌خرد؟»

سامان با جدیت گفت: «دقیقاً. و اگر گربه وارد جعبه شود، یعنی مشتری وفادار شده است.»

این بار خندهٔ چند نفر در جلسه کاملاً شنیده شد.

آقای فرهمند لب‌هایش را روی هم فشرد. مشخص بود که بین ناراحتی و خنده گیر کرده است.

سامان که حالا خودش هم به حرف‌هایش خندیده بود، تصمیم گرفت با تمام توان ادامه دهد. اسلاید سوم را باز کرد. روی آن نوشته شده بود:

روش اول: تبلیغ در مکان‌های شلوغ.

روش پنجم: اگر هیچ‌کدام جواب نداد، اسم برند را روی همه‌چیز چاپ کنید؛ حتی روی جوراب.

یکی از همکاران گفت: «من حاضرم جوراب تبلیغاتی بپوشم، به شرطی که حقوق اضافه بگیرم.»

سامان گفت: «این ایده را یادداشت می‌کنیم.»

فصل پنجم: فاجعهٔ پشت سر

درست زمانی که سامان داشت دربارهٔ رنگ‌های تبلیغاتی توضیح می‌داد، گربهٔ خانه‌اش، به نام پفک، وارد اتاق شد. پفک گربه‌ای خاکستری و بسیار کنجکاو بود که اعتقاد داشت هر چیزی روی میز قرار بگیرد، متعلق به اوست.

گربه با پنجه‌اش به لپ‌تاپ ضربه زد. تصویر دوربین ناگهان به سمت سقف چرخید. همه فقط سقف سفید اتاق را می‌دیدند و صدای سامان را می‌شنیدند که می‌گفت:

آقای فرهمند پرسید: «سامان، آیا در محل کار تو اتفاق خاصی افتاده است؟»

سامان تلاش کرد گربه را از روی میز بردارد، اما پفک تصمیم گرفته بود که همان‌جا بماند. در نهایت، سامان او را بغل کرد و دوباره مقابل دوربین نشست.

گربه با غرور به صفحه نگاه می‌کرد.

سامان گفت: «از آنجا که بحث ما دربارهٔ شناخت مشتری است، اجازه بدهید متخصص رفتار مصرف‌کننده را معرفی کنم.»

بعد گربه را کمی بالا آورد.

یکی از همکاران پرسید: «یعنی اگر جعبه را با لوگوی شرکت چاپ کنیم، پفک آن را می‌خرد؟»

سامان گفت: «اگر اندازه‌اش مناسب باشد، احتمالاً داخلش می‌رود.»

آقای فرهمند دستش را روی پیشانی گذاشت. این بار دیگر حتی خودش هم نتوانست جلوی لبخندش را بگیرد.

فصل ششم: پیشنهاد غیرمنتظره

پس از پایان ارائه، سامان انتظار داشت که مدیرش او را به دفترش احضار کند و دربارهٔ رفتار غیرحرفه‌ای‌اش توضیح بخواهد.

سامان صاف نشست.

«کدام نکته؟»

«تمام افراد حاضر در جلسه، حتی کسانی که معمولاً به‌سختی تمرکز می‌کنند، از ابتدا تا انتها به حرف‌های تو گوش دادند. ایدهٔ گربه و جعبه هم آن‌قدر ساده است که ممکن است برای یک تبلیغ خلاقانه مفید باشد.»

سامان با احتیاط پرسید: «یعنی اخراج نیستم؟»

مدیر گفت: «فعلاً نه.»

سکوتی کوتاه برقرار شد.

فصل هفتم: شهرت ناخواسته

هر وقت کسی دیر به جلسه می‌رسید، همکاران می‌گفتند: «نگران نباش، سامان هنوز با لباس خواب وارد نشده است.»

سامان گفت: «لباس رسمی خلاقانه. نسخهٔ حرفه‌ای‌تر روش مدیریت انرژی.»

نرگس خندید و گفت: «فقط امیدوارم اردکه در جلسهٔ بعدی ارائه نداشته باشه.»

همه خندیدند.

سپس سامان جدی‌تر ادامه داد:

«اما مهم‌تر از همه، فهمیدم که خلاقیت همیشه از یک دفتر شیک و لباس رسمی شروع نمی‌شود. گاهی یک اشتباه، یک تصویر خنده‌دار یا حتی یک گربهٔ کنجکاو می‌تواند ایده‌ای به ما بدهد که از ساعت‌ها فکر کردن به دست نمی‌آید. البته این به آن معنا نیست که از فردا همه با لباس خواب سر کار بیایند!»

کارکنان دوباره خندیدند.

فصل هشتم: آخرین غافلگیری

صبح دوشنبه، سامان زودتر از همیشه بیدار شد. لباس رسمی پوشید، موهایش را مرتب کرد، لپ‌تاپش را آماده کرد و پیش از شروع جلسه، دوربین را آزمایش کرد.

در همان لحظه، پفک از روی میز پرید و دکمه‌ای را فشار داد.

صفحهٔ لپ‌تاپ تغییر کرد. تصویر سامان به‌صورت تمام‌صفحه در جلسه ظاهر شد؛ با لباس رسمی، موهای مرتب و لبخندی کاملاً حرفه‌ای.

آقای فرهمند وارد جلسه شد و گفت:

«صبح بخیر، سامان. می‌بینم امروز کاملاً آماده‌ای.»

سامان لبخند زد.

«بله، آقای فرهمند. همه‌چیز تحت کنترل است.»

پفک در همان لحظه میو کرد و روی صفحه‌کلید نشست.

تصویر سامان دوباره چرخید و این بار دوربین مستقیماً از نزدیک، صورت گربه را نشان داد.

چند ثانیه سکوت برقرار شد.

بعد صدای مدیر بلند شد:

«سامان، فکر می‌کنم متخصص رفتار مصرف‌کننده می‌خواهد چیزی به ما بگوید.»

و سامان؟

او سرانجام یاد گرفت که برای یک جلسهٔ آنلاین، هم لباس مناسب بپوشد و هم دوربین را بررسی کند.

«فقط پنج دقیقهٔ دیگه...»

پایان.

«نه، آرمان. من تو را از مدت‌ها قبل می‌شناسم.»

صدای باران شدیدتر شد. آرمان تصمیم گرفت دیگر سؤال نپرسد. به خودش گفت شاید مرد یکی از مشتریان قدیمی شرکت باشد یا از اهالی روستایی که قبلاً به آنجا رفته است.

اما چند ثانیه بعد، مرد جمله‌ای گفت که تمام فکرهایش را متوقف کرد.

«هنوز هم از صدای زنگ تلفن در ساعت دوازده می‌ترسی؟»

آرمان ناگهان پایش را از روی گاز برداشت.

چند سال قبل، در شبی بارانی، تلفن خانه‌شان دقیقاً ساعت دوازده زنگ خورده بود. آن تماس خبر تصادف پدرش را به خانواده رسانده بود. از آن شب به بعد، آرمان همیشه در نیمه‌شب با شنیدن زنگ تلفن احساس اضطراب می‌کرد.

این موضوع را فقط اعضای خانواده‌اش می‌دانستند.

آرمان با صدایی جدی گفت: «شما کی هستید؟»

مرد سرش را به سمت پنجره چرخاند.

«بهتر است به جاده نگاه کنی. پیچ نزدیک است.»

آرمان به جلو نگاه کرد. واقعاً تابلوی یک پیچ خطرناک دیده می‌شد.

اما نکتهٔ عجیب این بود که او هنوز آن پیچ را در نقشه ندیده بود و مرد هم نمی‌توانست از پشت سر، تابلوی کنار جاده را به‌خوبی ببیند.

فصل سوم: ایستگاه قدیمی

پس از عبور از پیچ، جاده کمی باریک‌تر شد. در سمت راست، ساختمانی کوچک از پشت درختان ظاهر شد. سقفش فروریخته بود و تابلوی زنگ‌زده‌ای بالای ورودی آن آویزان بود.

آرمان سرعتش را کم کرد.

«این همان ایستگاه است؟»

مرد گفت: «بله. همین‌جا نگه دار.»

آرمان کنار ساختمان توقف کرد. چراغ‌های خودرو، نیمکت چوبی شکسته‌ای را روشن کردند. پشت نیمکت، تابلویی قدیمی دیده می‌شد که نام ایستگاه روی آن نوشته شده بود، اما بیشتر حروفش پاک شده بودند.

آرمان گفت: «اینجا که کاملاً متروکه است. مطمئنید می‌خواهید پیاده شوید؟»

مرد در را باز کرد.

«من همیشه همین‌جا پیاده می‌شوم.»

آرمان برگشت تا آخرین بار به او نگاه کند، اما صندلی عقب خالی بود.

در باز مانده بود و باران به داخل خودرو می‌ریخت.

آرمان با تعجب به اطراف نگاه کرد. هیچ‌کس در کنار خودرو نبود. مرد نمی‌توانست در چند ثانیه به پشت ساختمان رفته باشد؛ به‌خصوص که تنها در خروجی ایستگاه، مقابل چراغ‌های خودرو قرار داشت.

آرمان پیاده شد و با صدای بلند گفت: «آقا؟ کجا رفتید؟»

صدایش در میان درختان پیچید و بازگشت.

هیچ پاسخی نشنید.

او به داخل ایستگاه رفت. کف ساختمان پوشیده از گردوخاک بود. روی دیوارها آثار رطوبت دیده می‌شد و یک ساعت گرد قدیمی بالای باجهٔ فروش بلیت قرار داشت.

عقربه‌های ساعت روی دوازده و هفده دقیقه متوقف شده بودند.

آرمان تلفن همراهش را روشن کرد تا از ساختمان عکس بگیرد. درست وقتی دوربین را به سمت ساعت گرفت، صدای زنگی از داخل ایستگاه بلند شد.

صدایی شبیه زنگ تلفن قدیمی.

آرمان از جا پرید. تلفن همراهش را پایین آورد و به اطراف نگاه کرد. کنار باجه، دستگاه تلفن سیاهی روی میز قرار داشت. سیم آن از وسط پاره شده بود و روی بدنه‌اش لایه‌ای ضخیم از گردوغبار نشسته بود.

باوجوداین، زنگ دوباره به صدا درآمد.

آرمان یک قدم عقب رفت.

او به هیچ‌وجه نمی‌خواست به آن تلفن نزدیک شود، اما زنگ آن ادامه داشت. صدای زنگ در ساختمان خالی می‌پیچید و انگار از او می‌خواست گوشی را بردارد.

سرانجام، با دست‌هایی لرزان جلو رفت و گوشی را بلند کرد.

ابتدا فقط صدای خش‌خش شنید.

سپس صدای مردی از آن سوی خط گفت:

«آرمان؟»

آرمان نفسش را حبس کرد.

صدای مرد، صدای پدرش بود.

فصل چهارم: تماس از گذشته

آرمان گوشی را محکم گرفته بود و نمی‌توانست حرف بزند.

صدای پدرش دوباره شنیده شد:

«آرمان، صدای من را می‌شنوی؟»

آرمان با صدایی که به‌سختی از گلویش بیرون می‌آمد، گفت: «بابا؟»

چند ثانیه سکوت برقرار شد.

بعد صدای پدرش گفت: «اگر این پیام را می‌شنوی، باید از آنجا بروی. به جاده برنگرد. منتظر هیچ‌کس نمان.»

آرمان چشم‌هایش را بست. پدرش سال‌ها قبل از دنیا رفته بود. او خودش در مراسم خاک‌سپاری حضور داشت و به‌خوبی می‌دانست که صدای آن سوی خط نمی‌تواند واقعی باشد.

بااین‌حال، صدا دقیقاً همان بود؛ همان لحن آرام، همان مکث کوتاه میان جمله‌ها و همان شیوه‌ای که پدرش نام او را صدا می‌زد.

آرمان پرسید: «شما کجا هستید؟ چه اتفاقی افتاده؟»

پاسخی نیامد.

صدای خش‌خش بلندتر شد و سپس جمله‌ای دیگر شنیده شد:

«به آینه نگاه نکن.»

تماس قطع شد.

آرمان گوشی را روی دستگاه گذاشت و به سمت در خروجی دوید. وقتی از ساختمان بیرون آمد، باران تقریباً متوقف شده بود. خودرویش همان‌جا بود و چراغ‌هایش هنوز روشن بودند.

او سریع پشت فرمان نشست و درها را قفل کرد.

چند ثانیه به خودش فرصت داد تا آرام شود. به آینهٔ عقب نگاه نکرد. فقط دستانش را روی فرمان گذاشت و سعی کرد نفس‌هایش را منظم کند.

بعد موتور را روشن کرد و از کنار ایستگاه دور شد.

جاده خالی بود.

در ابتدا احساس کرد خطر را پشت سر گذاشته است. بااین‌حال، هرچه جلوتر می‌رفت، احساس می‌کرد چیزی در خودرو درست نیست. هوای داخل کابین سردتر شده بود و شیشه‌ها از داخل بخار می‌کردند.

دستش را روی بخار شیشه کشید تا دید بهتری داشته باشد.

در همان لحظه، صدایی از صندلی عقب شنید.

«گفتم که باید به ایستگاه برگردی.»

آرمان ترمز کرد.

خودرو در وسط جاده ایستاد. او چند ثانیه بی‌حرکت ماند و سپس، برخلاف هشدار صدای تلفن، به آینهٔ عقب نگاه کرد.

مرد پالتوپوش روی صندلی نشسته بود.

این بار صورتش واضح‌تر دیده می‌شد. پوستش رنگی خاکستری داشت و چشمانش به شکلی عجیب بی‌حرکت بودند.

آرمان فریاد زد: «تو کی هستی؟ از ماشین من برو بیرون!»

مرد گفت: «هنوز وقتش نرسیده.»

«وقت چه چیزی؟»

مرد دستش را به سمت شیشهٔ جلو بلند کرد.

«وقت رسیدن تو.»

فصل پنجم: جاده‌ای که دور خودش می‌چرخید

آرمان پایش را روی گاز گذاشت. خودرو با سرعت حرکت کرد. او تصمیم گرفت هر طور شده از جنگل خارج شود و خودش را به یک پمپ‌بنزین یا پاسگاه برساند.

اما پس از چند دقیقه، تابلوی قدیمی ایستگاه را دید.

همان ساختمان متروکه در سمت راست جاده قرار داشت.

آرمان ترمز کرد و با ناباوری به اطراف نگاه انداخت.

«این غیرممکنه! من مستقیم اومدم.»

مرد از صندلی عقب گفت: «بعضی جاده‌ها تو را به جایی می‌برند که باید برگردی.»

آرمان دوباره حرکت کرد. این بار از مسیر دیگری رفت که به نظر می‌رسید از جنگل خارج می‌شود. او پیچ‌ها را شمرد و به نشانه‌های کنار جاده دقت کرد. درختی با شاخهٔ شکسته، تابلوی محدودهٔ سرعت و سنگی بزرگ کنار مسیر؛ همه را به خاطر سپرد.

ده دقیقه بعد، همان درخت را دید.

پنج دقیقه بعد، همان تابلو.

و کمی بعد، همان سنگ بزرگ.

او دوباره به نقطهٔ شروع برگشته بود.

آرمان فریاد زد: «این دیگه چه جهنمیه؟»

مرد آرام گفت: «تو تنها کسی نیستی که این مسیر را طی می‌کند.»

«منظورت چیه؟»

مرد به شیشهٔ جلو اشاره کرد.

در دوردست، چراغ‌های دو خودرو دیده می‌شد. یکی از آن‌ها کامیونی قدیمی بود که آهسته در جاده حرکت می‌کرد. خودروی دیگر، یک ماشین کوچک و تیره‌رنگ بود.

آرمان به آن‌ها نزدیک شد. وقتی از کنار کامیون گذشت، راننده سرش را چرخاند و به او نگاه کرد. صورت راننده زیر نور کم‌رنگ داشبورد دیده نمی‌شد.

اما وقتی آرمان از کنار خودروی کوچک عبور کرد، قلبش به‌شدت تپید.

خودروی کوچک دقیقاً شبیه خودروی خودش بود.

همان رنگ، همان چراغ شکستهٔ سمت چپ و همان برچسب کوچک روی شیشهٔ عقب.

آرمان سرعتش را کم کرد و به آینه نگاه انداخت. خودروی شبیه او پشت سرش حرکت می‌کرد.

ناگهان خودرو از کنارش سبقت گرفت و جلوی او قرار گرفت.

آرمان پایش را روی ترمز گذاشت.

در خودروی جلویی، مردی پشت فرمان نشسته بود.

مردی با موهای خیس، پیراهن تیره و صورتی که آرمان آن را به‌خوبی می‌شناخت.

خودش بود.

نسخه‌ای از خودش که به نظر می‌رسید چند سال پیرتر شده است.

آن مرد سرش را برگرداند و مستقیم به او نگاه کرد. سپس لب‌هایش را حرکت داد.

آرمان از پشت شیشه توانست جمله را بخواند:

«برنگرد.»

در همان لحظه، چراغ‌های خودروی جلویی خاموش شدند.

وقتی دوباره روشن شدند، دیگر هیچ خودرویی در جاده نبود.

فصل ششم: حقیقت مسافر

آرمان خودرو را کنار جاده متوقف کرد. دیگر نمی‌توانست وانمود کند که همه‌چیز عادی است.

با صدایی خسته پرسید: «تو می‌دونی اینجا چه خبره. بهم بگو.»

مرد پالتوپوش مدتی سکوت کرد.

سپس گفت: «سال‌ها پیش، در همین جاده، مردی رانندگی می‌کرد. باران می‌بارید و تلفنش زنگ خورد. او عجله داشت که خودش را به خانه برساند. در مسیر، مسافری را دید که کنار جاده ایستاده بود.»

آرمان به سختی آب دهانش را قورت داد.

مرد ادامه داد: «راننده مسافر را سوار کرد. مسافر از او خواست کنار ایستگاه قدیمی توقف کند. اما راننده نپذیرفت. می‌خواست زودتر به خانه برسد.»

آرمان پرسید: «بعد چه شد؟»

مرد به پنجره خیره شد.

«راننده در پیچ بعدی کنترل خودرو را از دست داد. از آن شب به بعد، بعضی از مسافرانی که نیمه‌شب از این جاده عبور می‌کنند، او را می‌بینند. او هنوز به دنبال راهی است که سفرش را تمام کند.»

آرمان گفت: «تو همون راننده‌ای؟»

مرد آهسته سرش را تکان داد.

«من مسافرم.»

«پس چرا اسم من رو می‌دونی؟ چرا صدای پدرم رو شنیدم؟»

مرد برای نخستین بار مستقیم به او نگاه کرد.

«چون تو قبلاً هم اینجا بوده‌ای.»

آرمان با ناباوری گفت: «من هرگز به این جاده نیومدم.»

«شاید یادت نمی‌آید.»

مرد دستش را به جیب پالتو برد و عکسی قدیمی بیرون آورد. عکس را به سمت آرمان گرفت.

در تصویر، ایستگاه متروکه دیده می‌شد. جلوی آن سه نفر ایستاده بودند: مرد پالتوپوش، راننده‌ای با چهرهٔ آرمان و مردی مسن که آرمان او را فوراً شناخت.

پدرش.

آرمان عکس را از دست مرد گرفت. پشت عکس با خطی آشنا نوشته شده بود:

«برای آرمان، وقتی آماده شد حقیقت را بداند.»

دست‌های آرمان لرزید.

پدرش پیش از مرگ، هیچ‌وقت دربارهٔ این جاده حرفی نزده بود. یا شاید حرف زده بود و آرمان آن خاطره را فراموش کرده بود.

مرد گفت: «تو باید به ایستگاه برگردی. آنجا چیزی هست که باید پیدا کنی.»

آرمان به عکس نگاه کرد و سپس سرش را بلند کرد.

صندلی عقب خالی بود.

مرد ناپدید شده بود.

فصل هفتم: دفترچهٔ نگهبان

آرمان دوباره به ایستگاه برگشت. این بار ساختمان در سکوت کامل فرو رفته بود. باران قطع شده بود و از لابه‌لای ابرها، نور کم‌رنگ ماه روی سقف شکسته می‌افتاد.

او وارد ساختمان شد و به دنبال چیزی گشت که بتواند توضیحی برای اتفاقات آن شب باشد.

پشت باجهٔ فروش بلیت، کشویی چوبی پیدا کرد. کشو به‌سختی باز شد و داخل آن دفترچه‌ای قدیمی قرار داشت. جلد دفترچه پوسیده شده بود، اما نوشته‌های صفحات داخلی هنوز خوانا بودند.

آرمان صفحهٔ اول را باز کرد.

«گزارش نگهبان ایستگاه، بیست‌وپنج سال پیش.»

صفحه‌های بعدی دربارهٔ مسافرانی بود که شب‌ها در جاده دیده می‌شدند. در چند گزارش، نام مردی تکرار شده بود که در باران به خودروها نزدیک می‌شد و از رانندگان می‌خواست او را تا ایستگاه ببرند.

در آخرین صفحه، یادداشتی با خط پدر آرمان نوشته شده بود:

«اگر پسرم روزی به اینجا آمد، باید بداند که همه‌چیز تقصیر او نیست. من آن شب حقیقت را از او پنهان کردم تا بتواند زندگی‌اش را ادامه دهد.»

آرمان روی زمین نشست.

در ادامهٔ یادداشت آمده بود که سال‌ها پیش، خانوادهٔ او در همین جاده دچار حادثه‌ای شده بودند. پدرش رانندگی می‌کرد و آرمان کودک بود. در میانهٔ راه، آن‌ها مردی را کنار جاده دیده بودند. پدر توقف کرده بود تا به او کمک کند.

اما آن مرد ناپدید شده بود.

چند دقیقه بعد، خودرو از جاده منحرف شده بود. پدر آرمان نجات یافته بود، اما مادرش برای مدتی طولانی در بیمارستان بستری شده بود. آرمان کودک، جزئیات آن شب را به‌خاطر نمی‌آورد.

پدرش بعداً فهمیده بود که این جاده، سال‌ها پیش محل یک حادثهٔ مرگبار بوده و از آن زمان، داستان‌های زیادی دربارهٔ مسافر نیمه‌شب نقل می‌شده است.

در پایان دفترچه نوشته شده بود:

«مسافر همیشه به دنبال کسی نیست که او را به مقصد برساند. گاهی فقط می‌خواهد کسی داستانش را بشنود.»

آرمان دفترچه را بست.

برای نخستین بار در آن شب، احساس کرد شاید بتواند بفهمد چرا آن مرد او را انتخاب کرده است.

فصل هشتم: آخرین توقف

آرمان از ایستگاه بیرون آمد و به جاده نگاه کرد. هوا آرام بود. نه صدای بارانی وجود داشت و نه باد شدیدی میان درختان می‌پیچید.

او پشت فرمان نشست، اما این بار موتور را روشن نکرد.

به ساعت داشبورد نگاه کرد.

  body: `
فصل اول: بادبادکی به رنگ غروب

نیما هشت ساله بود که برای نخستین بار فهمید بعضی از خوشبختی‌ها را نمی‌توان خرید؛ حتی اگر تمام پول دنیا را در جیب داشته باشی.

آن روز، پدرش با یک جعبهٔ مقوایی وارد خانه شد. نیما که روی فرش اتاق نشسته بود و با ماشین‌های اسباب‌بازی‌اش بازی می‌کرد، به‌سرعت بلند شد و به طرف او دوید.

پرسید: «بابا، توی جعبه چیه؟»

پدرش لبخند زد و گفت: «یک چیز خیلی مهم. ولی برای فهمیدنش باید کمکم کنی.»

جعبه را روی میز گذاشت و در آن را باز کرد. داخلش چند تکه چوب باریک، کاغذ رنگی قرمز، نخ سفید، چسب و یک قیچی قرار داشت.

نیما با تعجب گفت: «می‌خوایم کاردستی درست کنیم؟»

پدرش روی صندلی نشست و او را کنار خودش نشاند.

«نه فقط کاردستی. امروز می‌خواهیم چیزی بسازیم که بتواند از زمین بلند شود و تا نزدیک ابرها برود.»

چشم‌های نیما برق زد.

«هواپیما؟»

«نه.»

«موشک؟»

«نه، از آن هم بهتر.»

پدرش کاغذ قرمز را بالا گرفت.

«بادبادک.»

نیما از خوشحالی بالا و پایین پرید. او همیشه بادبادک‌های رنگارنگ را در آسمان دیده بود، اما هیچ‌وقت یکی از آن‌ها را نداشت. چند بار از پدرش خواسته بود برایش بادبادک بخرد، اما پدر می‌گفت روزی با هم بادبادکی خواهند ساخت که از تمام بادبادک‌های دنیا زیباتر باشد.

حالا آن روز رسیده بود.

آن‌ها تا عصر مشغول کار شدند. پدر چوب‌ها را به شکل ضربدر روی هم قرار داد و نیما کاغذ قرمز را نگه داشت. هر بار که چسب به انگشتانش می‌چسبید، با خنده آن را جدا می‌کرد و پدرش وانمود می‌کرد که انگشتان پسرش به هم قفل شده‌اند.

در پایان، بادبادکی ساخته بودند که چندان هم بی‌نقص نبود. یکی از گوشه‌هایش کمی کج بود و دم آن از پارچه‌های رنگی ناهماهنگ درست شده بود.

اما برای نیما، زیباترین چیزی بود که در تمام عمرش دیده بود.

پرسید: «اسمش رو چی بذاریم؟»

پدر کمی فکر کرد.

«اسمش رو می‌گذاریم امید.»

نیما نام را چند بار تکرار کرد.

«امید... امید...»

بعد بادبادک را محکم در آغوش گرفت و گفت: «قول می‌دم هیچ‌وقت خرابش نکنم.»

پدر دستش را روی موهای او کشید.

«لازم نیست قول بدهی هیچ‌وقت خراب نشود. فقط قول بده اگر روزی افتاد، دوباره بلندش کنی.»

نیما آن روز معنای جمله را نفهمید. فقط سرش را تکان داد و به پنجره نگاه کرد.

باد ملایمی می‌وزید.

فصل دوم: تپهٔ پشت خانه

پدر و پسر برای هوا کردن بادبادک به تپه‌ای در پشت محله رفتند. تپه بلند نبود، اما از بالای آن می‌شد خانه‌ها، باغ کوچک شهر و رودخانه‌ای را دید که میان درختان پیچ می‌خورد.

آسمان به رنگ نارنجی درآمده بود و ابرهای پراکنده مانند تکه‌های پنبه در دوردست حرکت می‌کردند.

پدر نخ بادبادک را به نیما داد.

«حاضری؟»

نیما سرش را با هیجان تکان داد.

پدر چند قدم دوید و بادبادک را بالا گرفت. نیما نیز شروع به دویدن کرد. بادبادک ابتدا روی زمین کشیده شد، سپس گوشه‌ای از آن بالا رفت و دوباره پایین افتاد.

نیما ایستاد و با ناراحتی گفت: «نشد!»

پدر خندید.

«یک بار دیگر.»

دوباره تلاش کردند. این بار بادبادک چند متر از زمین فاصله گرفت، اما ناگهان چرخید و روی چمن‌ها افتاد.

نیما لب‌هایش را جمع کرد.

«فکر کنم بادبادکمون خراب شده.»

پدر کنار او زانو زد.

«می‌دانی چرا هنوز بالا نرفته؟»

«چون باد کافی نیست؟»

«شاید. اما گاهی باید یاد بگیریم در زمان درست حرکت کنیم. اگر زودتر از باد بدویم، نخ شل می‌شود. اگر دیر کنیم، باد از دستمان می‌رود.»

نیما به آسمان نگاه کرد. باد آرام‌آرام قوی‌تر می‌شد.

پدر گفت: «حالا دوباره امتحان کنیم.»

این بار، نیما با تمام توان دوید. باد به کاغذ قرمز برخورد کرد و بادبادک بالا رفت؛ ابتدا کمی لرزان، سپس سریع‌تر و بالاتر.

نیما فریاد زد: «بابا! نگاه کن! داره می‌ره بالا!»

پدر کنار او می‌دوید و نخ را آرام‌آرام آزاد می‌کرد.

بادبادک از بالای درختان گذشت و در آسمان نارنجی شناور شد. دم رنگارنگش در باد می‌رقصید و از دور مانند خطی از رنگ‌ها به نظر می‌رسید.

نیما از خوشحالی نمی‌توانست جلوی خنده‌اش را بگیرد.

«بابا، فکر می‌کنی به ابرها می‌رسه؟»

پدر گفت: «شاید نه به خود ابرها، اما می‌تواند از جایی که ما ایستاده‌ایم خیلی دورتر برود.»

نیما پرسید: «پس چرا نخ رو نگه می‌داریم؟»

پدر کمی مکث کرد.

«چون هر چیزی برای پرواز کردن به آزادی نیاز دارد، اما گاهی داشتن یک رشتهٔ کوچک ارتباط باعث می‌شود راه خانه را فراموش نکند.»

آن روز، آن‌ها تا تاریک شدن هوا روی تپه ماندند. وقتی به خانه برگشتند، نیما بادبادک را کنار تختش گذاشت و پیش از خواب، چند بار از جایش بلند شد تا مطمئن شود هنوز همان‌جاست.

او نمی‌دانست که روزی، همین بادبادک کوچک به یکی از مهم‌ترین خاطرات زندگی‌اش تبدیل خواهد شد.

فصل سوم: روزهایی که تندتر می‌گذشتند

سال‌ها گذشتند.

نیما بزرگ‌تر شد و روزهای کودکی آرام‌آرام جای خود را به مدرسه، امتحان‌ها و مسئولیت‌های تازه دادند. بادبادک قرمز دیگر هر روز به تپه نمی‌رفت. ابتدا هفته‌ای یک بار و سپس فقط در تعطیلات از جعبه بیرون آورده می‌شد.

اما پدر هنوز گاهی عصرها از او می‌خواست همراهش قدم بزند.

با هم به نانوایی می‌رفتند، در پارک می‌نشستند و دربارهٔ چیزهای ساده حرف می‌زدند؛ دربارهٔ همسایه‌ای که همیشه گل‌هایش را بیش از حد آب می‌داد، دربارهٔ گربه‌ای که هر روز جلوی مغازهٔ سر کوچه می‌خوابید و دربارهٔ آرزوهایی که نیما برای آینده داشت.

نیما می‌خواست مهندس شود. می‌خواست خانه‌ای بزرگ بسازد، به شهرهای مختلف سفر کند و روزی برای پدرش ماشینی بخرد که دیگر مجبور نباشد با اتوبوس به محل کار برود.

پدر به آرزوهایش گوش می‌داد و هر بار می‌گفت:

«لازم نیست همه‌چیز را یک‌باره به دست بیاوری. فقط قدم بعدی را درست بردار.»

گاهی نیما از این حرف خسته می‌شد.

می‌گفت: «بابا، تو همیشه می‌گی قدم بعدی. من می‌خوام بدونم آخرش چی می‌شه.»

پدر لبخند می‌زد.

«آخرش را کسی نمی‌داند. اگر همه‌چیز از اول معلوم بود، شاید هیچ‌کس برای رسیدن به فردا هیجان نداشت.»

در همان سال‌ها، مادر نیما تصمیم گرفت برای ادامهٔ تحصیل به شهری دیگر برود. ابتدا قرار بود نیما نیز همراه او برود، اما برنامه‌ها تغییر کرد و او موقتاً با پدرش ماند.

مدتی بعد، پدرش شغل دیگری پیدا کرد که ساعت‌های طولانی‌تری از خانه دورش می‌کرد. نیما کم‌کم به زندگی تازه عادت کرد. گاهی خودش غذا گرم می‌کرد، تکالیفش را انجام می‌داد و تا بازگشت پدر در اتاقش می‌ماند.

بااین‌حال، هر جمعه عصر، پدر سعی می‌کرد برایش وقت بگذارد.

یک بار نیما گفت: «چرا مثل قبل نمی‌تونیم هر روز با هم بریم تپه؟»

پدر دستش را روی شانهٔ او گذاشت.

«چون زندگی بزرگ‌تر شده، پسرم. اما این به معنی کوچک‌تر شدن دوست داشتن نیست.»

نیما چیزی نگفت.

او هنوز آن‌قدر کوچک بود که تصور می‌کرد اگر کسی کمتر کنارش باشد، حتماً کمتر دوستش دارد.

سال بعد، نیما وارد دورهٔ جدیدی از مدرسه شد. دوستان تازه‌ای پیدا کرد و بیشتر وقتش را با آن‌ها می‌گذراند. وقتی پدر پیشنهاد می‌داد به تپه بروند، گاهی بهانه می‌آورد.

«امروز امتحان دارم.»

«امروز با دوستام قرار گذاشتم.»

«هفتهٔ بعد می‌ریم، باشه؟»

پدر همیشه می‌گفت: «باشه.»

او هرگز نیما را مجبور نمی‌کرد. فقط بادبادک قرمز را در جعبه نگه می‌داشت و هر چند وقت یک بار، نخ آن را مرتب می‌کرد تا گره نخورد.

فصل چهارم: آخرین قول

یک زمستان سرد، پدر نیما بیمار شد.

ابتدا همه فکر می‌کردند بیماری ساده‌ای است که با چند روز استراحت برطرف می‌شود. اما روزها گذشتند و حال پدر بهتر نشد. او بیشتر وقتش را در خانه می‌گذراند و برای انجام کارهای ساده نیز زود خسته می‌شد.

نیما که حالا نوجوان شده بود، تلاش می‌کرد نگرانی‌اش را نشان ندهد. درس می‌خواند، به کارهای خانه کمک می‌کرد و هر بار که پدر از او می‌پرسید اوضاع مدرسه چگونه است، با لبخند جواب می‌داد.

«همه‌چیز خوبه.»

اما وقتی تنها می‌شد، به صدای آهستهٔ پدر از اتاق کناری گوش می‌داد و دلش می‌خواست زمان به عقب برگردد؛ به روزهایی که بزرگ‌ترین مشکلشان بالا نرفتن یک بادبادک بود.

یک عصر، پدر او را صدا زد.

«نیما، می‌توانی آن جعبهٔ قدیمی را از کمد بیاوری؟»

نیما جعبه را آورد و روی تخت گذاشت. بادبادک قرمز داخل آن بود. کاغذش کمی رنگ باخته و یکی از چوب‌هایش ترک برداشته بود، اما هنوز قابل استفاده بود.

پدر با دیدن آن لبخند زد.

«یادت هست اولین بار کجا هواش کردیم؟»

نیما کنار تخت نشست.

«روی تپه. تو گفتی باید منتظر باد بمونیم.»

«و یادت هست وقتی افتاد، چه کار کردیم؟»

«دوباره بلندش کردیم.»

پدر دستش را به سوی او دراز کرد. نیما دستش را گرفت.

پدر گفت: «می‌خواهم یک چیزی را به تو بگویم. شاید وقتی بزرگ‌تر شدی بهتر معنایش را بفهمی.»

نیما ساکت ماند.

«زندگی همیشه مطابق برنامه پیش نمی‌رود. بعضی آدم‌ها زودتر از چیزی که انتظار داریم از کنارمان می‌روند. بعضی آرزوها هم آن‌طور که می‌خواهیم اتفاق نمی‌افتند. اما این به معنی تمام شدن همه‌چیز نیست.»

چشم‌های نیما پر از اشک شد.

«بابا، این حرف‌ها رو نزن. تو خوب می‌شی.»

پدر لبخند کم‌رنگی زد.

«من هم امیدوارم. اما می‌خواهم اگر روزی دلت برای من تنگ شد، یادت باشد که قرار نیست تمام زندگی‌ات را در همان لحظه‌ای که از دست داده‌ای متوقف کنی.»

نیما سرش را پایین انداخت.

پدر ادامه داد:

«یک روز، وقتی احساس کردی دیگر نمی‌توانی جلو بروی، این بادبادک را بردار. برو همان تپه. اگر باد بود، آن را هوا کن. اگر باد نبود، منتظر بمان. لازم نیست برای هر چیزی عجله کنی.»

نیما با صدایی لرزان گفت: «قول بده خودت هم باهام میای.»

پدر دست او را فشرد.

«اگر بتوانم، حتماً.»

آن شب، نیما مدت زیادی کنار پدر ماند. دربارهٔ مدرسه حرف زدند، از خاطرات خنده‌دارشان گفتند و حتی دربارهٔ آن گربهٔ تنبلی که هنوز جلوی مغازهٔ محله می‌خوابید، شوخی کردند.

وقتی نیما به اتاقش رفت، بادبادک را کنار تخت گذاشت.

پیش از خواب با خودش گفت: «وقتی بابا خوب شد، دوباره می‌ریم تپه.»

او نمی‌دانست که گاهی بعضی قول‌ها را نمی‌توان به همان شکلی که انتظار داریم، به پایان رساند.

فصل پنجم: خانه‌ای با یک صندلی خالی

چند ماه بعد، پدر نیما از دنیا رفت.

خانه پر از آدم بود. اقوام و آشنایان برای تسلیت آمده بودند و همه با صدای آهسته صحبت می‌کردند. بعضی‌ها از خاطرات پدر تعریف می‌کردند و بعضی‌ها به نیما می‌گفتند که باید قوی باشد.

اما نیما نمی‌دانست قوی بودن یعنی چه.

او فقط می‌خواست صدای کلید را در قفل در بشنود، پدر وارد خانه شود و مثل همیشه بپرسد:

«خب، امروز چه خبر؟»

روزهای نخست، نیما هنوز عادت داشت هنگام شام برای پدرش جا بگذارد. گاهی از اتاقش بیرون می‌آمد تا چیزی را به او نشان دهد و بعد، وقتی سکوت خانه را به یاد می‌آورد، دوباره به اتاق برمی‌گشت.

مادرش پس از مدتی به خانه بازگشت و تلاش کرد زندگی را به روال عادی برگرداند. او برای نیما غذا درست می‌کرد، دربارهٔ مدرسه از او سؤال می‌پرسید و سعی می‌کرد در روزهای سخت کنارش باشد.

اما هیچ‌کدام از آن‌ها نمی‌توانستند جای خالی پدر را پر کنند.

نیما دیگر به تپه نمی‌رفت.

بادبادک قرمز را در همان جعبه گذاشت و جعبه را به بالاترین طبقهٔ کمد منتقل کرد. نمی‌خواست آن را ببیند. هر بار که تصویر کاغذ قرمز در ذهنش ظاهر می‌شد، به یاد آخرین قول پدر می‌افتاد و احساس می‌کرد چیزی درونش سنگین می‌شود.

سال‌ها گذشتند.

نیما دبیرستان را تمام کرد، وارد دانشگاه شد و برای ادامهٔ تحصیل به شهری دیگر رفت. زندگی‌اش پر از کلاس، پروژه و کارهای تازه شد. او دوستان جدیدی پیدا کرد و گاهی حتی چند روز می‌گذشت که به خانهٔ قدیمی فکر نمی‌کرد.

اما بعضی تاریخ‌ها هرگز از ذهنش پاک نشدند.

روز تولد پدر.

روز اولین باری که با هم بادبادک هوا کرده بودند.

و روزی که آخرین بار صدای او را شنیده بود.

نیما هر سال در این روزها به خانه برمی‌گشت، اما هرگز به سراغ جعبه نمی‌رفت.

او فکر می‌کرد اگر بادبادک را دوباره ببیند، تمام غم‌هایی که با گذشت زمان آرام شده‌اند، به یک‌باره برمی‌گردند.

بنابراین، زندگی را ادامه می‌داد و وانمود می‌کرد که گذشته در همان کمد قدیمی باقی مانده است.

فصل ششم: نامه‌ای که دیر رسید

ده سال پس از مرگ پدر، نیما برای مرتب کردن خانهٔ قدیمی به محلهٔ کودکی‌اش برگشت. مادرش تصمیم گرفته بود بعضی از وسایل انبار را مرتب کند و از او کمک خواسته بود.

در میان جعبه‌های کتاب، لباس‌های قدیمی و وسایل خراب، صندوقچه‌ای چوبی پیدا کردند که نیما قبلاً آن را ندیده بود.

مادرش گفت: «این صندوقچه مال پدرت بود. فکر می‌کنم سال‌هاست بازش نکرده‌ایم.»

قفل کوچک آن زنگ زده بود. نیما با کمی تلاش در صندوقچه را باز کرد. داخل آن چند عکس، دفترچه‌ای قدیمی، یک ساعت مچی و پاکتی سفید قرار داشت.

روی پاکت، نام نیما نوشته شده بود.

دست‌خط متعلق به پدرش بود.

نیما برای مدتی طولانی فقط به نام خودش نگاه کرد. سپس پاکت را برداشت و آن را باز کرد.

نامه با این جمله آغاز می‌شد:

«نیما جان، اگر روزی این نامه را می‌خوانی، یعنی آن‌قدر بزرگ شده‌ای که شاید بتوانی حرف‌هایی را بفهمی که گفتنشان برای من آسان نبود.»

نیما روی زمین نشست و شروع به خواندن کرد.

«پسرم، من همیشه دوست داشتم بیشتر کنارت باشم. می‌خواستم هر روز تو را از مدرسه به خانه بیاورم، هر عصر با تو قدم بزنم و تمام سؤال‌هایی را که دربارهٔ دنیا داری، جواب بدهم. اما زندگی همیشه به ما فرصت نمی‌دهد که همهٔ کارهایی را که دوست داریم انجام دهیم.

گاهی فکر می‌کردم اگر بیشتر کار کنم، بتوانم آیندهٔ بهتری برایت بسازم. شاید به همین دلیل، بعضی روزها آن‌قدر خسته به خانه برمی‌گشتم که فقط می‌توانستم کنار تو بنشینم و به حرف‌هایت گوش کنم. اگر روزی احساس کردی که نبودنم به معنی کم بودن علاقه‌ام بوده، می‌خواهم بدانی که این‌طور نبود.

هر بار که از تپه به خانه برمی‌گشتیم، وقتی می‌دیدم بادبادک را با خودت به اتاقت می‌بری، خوشحال می‌شدم. آن بادبادک برای من فقط یک اسباب‌بازی نبود. به من یادآوری می‌کرد که برای ساختن یک خاطرهٔ خوب، همیشه به پول یا امکانات زیاد احتیاج نیست. گاهی کافی است کنار کسی باشی که دوستش داری و برای چند ساعت، تمام دنیا را فراموش کنی.

اگر روزی بزرگ شدی و از من دور بودی، نگران نباش. آدم‌ها ممکن است از یکدیگر فاصله بگیرند، اما خاطرات خوب می‌توانند راه برگشت را نشانشان بدهند.

و یک چیز دیگر، نیما جان: اگر روزی دلت برای من تنگ شد، مجبور نیستی غمت را پنهان کنی. گریه کردن به معنی ضعیف بودن نیست. دلتنگی یعنی کسی در زندگی‌ات آن‌قدر مهم بوده که نبودنش احساس می‌شود.

من نمی‌توانم قول بدهم همیشه کنارت باشم. اما می‌توانم بگویم که روزهایی که با هم گذراندیم، برای من از بهترین روزهای زندگی‌ام بودند.

اگر بادبادک هنوز در کمد است، آن را دور نینداز. نه به این دلیل که باید همیشه به گذشته نگاه کنی، بلکه چون روزی با هم آن را ساخته‌ایم. وقتی آماده بودی، دوباره آن را هوا کن.

دوستت دارم، پسرم.

بابا.»

نیما به آخر نامه رسید، اما نتوانست آن را زمین بگذارد. اشک‌هایش روی کاغذ می‌چکیدند و او تلاش نمی‌کرد جلویشان را بگیرد.

سال‌ها بود که فکر می‌کرد برای ادامه دادن باید خاطرات را کنار بگذارد. حالا می‌فهمید که لازم نیست گذشته را فراموش کند تا بتواند به آینده قدم بگذارد.

مادرش آرام کنار او نشست و دستش را روی شانه‌اش گذاشت.

هیچ‌کدام چیزی نگفتند.

گاهی بعضی نامه‌ها به پاسخ نیاز ندارند؛ فقط باید خوانده شوند.

فصل هفتم: بازگشت به تپه

صبح روز بعد، نیما جعبهٔ بادبادک را از کمد بیرون آورد.

کاغذ قرمز آن تقریباً رنگش را از دست داده بود. یکی از چوب‌ها شکسته و نخ سفیدش به چند گره کوچک گرفتار شده بود.

نیما با خودش گفت: «دیگه نمی‌تونه پرواز کنه.»

اما بعد جملهٔ پدر را به یاد آورد: اگر روزی افتاد، دوباره بلندش کن.

او تصمیم گرفت بادبادک را تعمیر کند.

چند تکه کاغذ تازه، چوب باریک و نخ تهیه کرد. ساعت‌ها روی زمین نشست و با دقت قسمت‌های آسیب‌دیده را درست کرد. تلاش کرد شکل اصلی بادبادک را حفظ کند، حتی اگر لازم بود بعضی بخش‌هایش را تغییر دهد.

وقتی کارش تمام شد، بادبادک دیگر دقیقاً همان بادبادک کودکی نبود. کاغذ قرمز تازه‌ای روی قسمت‌های پاره‌شده قرار گرفته بود و دم آن با چند نوار رنگی جدید بلندتر شده بود.

اما هنوز همان بادبادک بود.

عصر، نیما به تپهٔ پشت خانه رفت.

راه باریک میان درختان تغییر چندانی نکرده بود. چند خانهٔ تازه ساخته شده بودند و درختی که قبلاً کنار مسیر قرار داشت، بلندتر شده بود. اما وقتی به بالای تپه رسید، منظرهٔ رودخانه و خانه‌های شهر تقریباً همان بود.

نیما جعبه را روی زمین گذاشت و بادبادک را بیرون آورد.

برای چند دقیقه فقط به آن نگاه کرد.

او به یاد آورد که چگونه پدرش چوب‌ها را به هم بسته بود، چگونه چسب به انگشتانش چسبیده بود و چگونه اولین تلاششان برای پرواز شکست خورده بود.

صدای پدر در ذهنش پیچید:

«یک بار دیگر.»

نیما نخ را در دست گرفت و شروع به دویدن کرد.

بادبادک ابتدا از زمین بلند نشد. گوشهٔ کاغذ آن به چمن‌ها برخورد کرد و دوباره پایین افتاد.

نیما ایستاد.

برای لحظه‌ای احساس کرد که باید تسلیم شود. سال‌ها بود که به این تپه نیامده بود و شاید دیگر نمی‌توانست همان احساس کودکی را تجربه کند.

اما سپس به آسمان نگاه کرد.

باد هنوز آرام بود.

او منتظر ماند.

چند دقیقه بعد، نسیم خنکی از سمت رودخانه وزید. نیما بادبادک را بالا گرفت و دوباره دوید.

این بار، بادبادک از زمین فاصله گرفت.

چند متر بالا رفت، کمی لرزید و سپس در آسمان قرار گرفت.

نیما ایستاد و نخ را آرام آزاد کرد.

بادبادک قرمز بالاتر رفت. دم رنگارنگش در باد حرکت می‌کرد و نور غروب روی کاغذ آن می‌تابید.

نیما لبخند زد.

نه به این دلیل که غمش از بین رفته بود، بلکه چون برای نخستین بار پس از سال‌ها، توانسته بود در کنار خاطرهٔ پدرش احساس آرامش کند.

آرام گفت: «بالاخره آوردمش، بابا.»

بادبادک در آسمان می‌چرخید و نیما نخ آن را در دست داشت.

او نمی‌دانست بادبادک تا کجا بالا می‌رود. شاید فقط چند دقیقه پرواز می‌کرد و بعد پایین می‌آمد. شاید هم باد آن را به نقطه‌ای دور می‌برد.

اما حالا دیگر لازم نبود همه‌چیز را از قبل بداند.

فصل هشتم: بادبادکی برای فردا

خورشید کم‌کم پشت کوه‌ها پنهان می‌شد. نیما روی چمن‌ها نشست و نخ بادبادک را کنار خود گذاشت. باد همچنان می‌وزید و بادبادک در آسمان می‌رقصید.

او به سال‌هایی فکر کرد که پشت سر گذاشته بود؛ به روزهایی که پدرش زنده بود، به روزهایی که از او دور شده بود و به تمام فرصت‌هایی که فکر می‌کرد برای همیشه از دست داده است.

اگر می‌توانست به گذشته برگردد، شاید بعضی روزها را متفاوت می‌گذراند. شاید بیشتر کنار پدر می‌نشست، زودتر به دعوت‌هایش پاسخ می‌داد و کمتر می‌گفت «هفتهٔ بعد».

اما زندگی راه برگشت نداشت.

نیما فهمید که پشیمانی، هرچقدر هم واقعی باشد، نمی‌تواند زمان را تغییر دهد. تنها چیزی که می‌توانست انجام دهد، این بود که از آنچه گذشته بود چیزی یاد بگیرد.

او تصمیم گرفت از این پس، وقتی مادرش از او می‌خواست با هم قدم بزنند، کارهایش را برای چند دقیقه کنار بگذارد. وقتی دوستانش به کمک نیاز داشتند، تا جایی که می‌توانست کنارشان باشد. و وقتی روزی خودش خانواده‌ای تشکیل می‌داد، برای ساختن خاطرات کوچک وقت بگذارد.

چون گاهی مهم‌ترین چیزهایی که در زندگی به یاد می‌آوریم، همان لحظه‌هایی هستند که در زمان وقوعشان ساده و معمولی به نظر می‌رسند.

صدای خنده‌ای از پایین تپه آمد. چند کودک همراه خانواده‌هایشان برای هوا کردن بادبادک آمده بودند. یکی از بادبادک‌ها روی زمین افتاده بود و پسربچه‌ای با ناراحتی به آن نگاه می‌کرد.

نیما بلند شد و به طرف او رفت.

«کمک می‌خوای؟»

پسرک سرش را تکان داد.

نیما کنار او زانو زد و چوب بادبادک را مرتب کرد. سپس به او توضیح داد که باید منتظر بماند تا باد کمی قوی‌تر شود.

پسرک پرسید: «اگه باز هم بالا نرفت چی؟»

نیما لبخند زد.

«دوباره امتحان می‌کنیم.»

آن‌ها چند دقیقه منتظر ماندند. وقتی باد وزید، پسرک دوید و بادبادکش را بالا برد. بادبادک ابتدا لرزید و سپس در آسمان شناور شد.

پسرک با خوشحالی فریاد زد و به طرف خانواده‌اش دوید.

نیما از دور نگاهش کرد.

برای لحظه‌ای احساس کرد پدرش کنار او ایستاده است؛ نه به شکلی که بتواند او را ببیند یا صدایش را بشنود، بلکه در خاطره‌ای که هنوز در قلبش زنده بود.

او دوباره به بادبادک قرمز نگاه کرد.

وقت برگشتن بود.

نیما نخ را جمع کرد و بادبادک را با دقت داخل جعبه گذاشت. تصمیم نداشت آن را دوباره به بالاترین طبقهٔ کمد پنهان کند. می‌خواست جعبه را در جایی نگه دارد که هر وقت به آن نگاه می‌کرد، به یاد بیاورد زندگی فقط دربارهٔ از دست دادن نیست؛ دربارهٔ چیزهایی هم هست که از آدم‌هایی که دوستشان داریم، در وجود ما باقی می‌مانند.

در راه خانه، هوا تاریک شد. چراغ‌های شهر یکی‌یکی روشن شدند و نسیم خنکی از میان درختان گذشت.

نیما دستش را روی جعبه گذاشت و آرام گفت:

«قولم رو فراموش نکردم، بابا. هر وقت افتادم، دوباره بلند می‌شم.»

باد از کنار او گذشت.

و برای نخستین بار پس از سال‌ها، نیما احساس کرد که می‌تواند بدون فراموش کردن گذشته، به سوی آینده حرکت کند.

پایان.

  body: `
فصل اول: یک نقشهٔ فوق‌العاده

آرش هفده سال داشت و در تمام عمرش سه چیز را با اطمینان می‌دانست: اول اینکه ریاضی از آن چیزی که معلمش ادعا می‌کرد سخت‌تر است، دوم اینکه گربه‌ها همیشه وانمود می‌کنند گرسنه‌اند، حتی وقتی تازه غذا خورده‌اند، و سوم اینکه آشپزی کار ساده‌ای است.

البته مورد سوم را از روی تجربه نمی‌گفت.

آرش تا آن روز حتی یک تخم‌مرغ را هم بدون کمک درست نکرده بود. یک بار سعی کرده بود برای خودش نیمرو بپزد، اما به‌جای روغن از آب استفاده کرده بود؛ چون تصور می‌کرد هر دو مایع‌اند و احتمالاً تفاوت چندانی ندارند. نتیجه چیزی شبیه تخم‌مرغ آب‌پز له‌شده‌ای بود که حتی گربهٔ خانه، فندق، هم با بدگمانی به آن نگاه کرده بود.

بااین‌حال، آرش اعتقاد داشت که استعدادهایش هنوز کشف نشده‌اند.

یک هفته مانده به تولد مادرش، تصمیم گرفت برای او شام ویژه‌ای درست کند. مادرش همیشه برای خانواده غذا می‌پخت، حتی وقتی از کار خسته به خانه برمی‌گشت. آرش می‌خواست این بار او بدون نگرانی پشت میز بنشیند و از غذایی که پسرش آماده کرده بود لذت ببرد.

او نقشه‌اش را روی کاغذ نوشت:

۱. پیدا کردن یک دستور غذای ساده.
۲. خرید مواد لازم.
۳. پختن شام.
۴. تمیز کردن آشپزخانه.
۵. دریافت جایزهٔ احتمالی.

در کنار مرحلهٔ پنجم، با خط درشت نوشت: «شاید یک ماه اجازهٔ بیرون رفتن بیشتر!»

سپس لپ‌تاپش را باز کرد و عبارت «غذای شیک برای مبتدی‌ها» را جست‌وجو کرد.

صدها نتیجه ظاهر شدند. بعضی‌ها غذاهایی با نام‌های عجیب معرفی می‌کردند و بعضی دیگر ادعا داشتند که در ده دقیقه می‌توانند یک شام رستورانی بسازند.

آرش سرانجام ویدیویی را انتخاب کرد که عنوانش این بود: «یک شام عالی در پانزده دقیقه!»

با خودش گفت: «پانزده دقیقه؟ این که از حل کردن یک مسئلهٔ ریاضی هم راحت‌تره.»

او هنوز نمی‌دانست که آن ویدیو قرار است یکی از طولانی‌ترین روزهای زندگی‌اش را رقم بزند.

فصل دوم: خریدی پر از اعتمادبه‌نفس

صبح روز تولد مادر، آرش زودتر از همیشه بیدار شد. پدرش برای انجام کاری بیرون رفته بود و مادرش هنوز خواب بود.

آرش فهرست مواد لازم را برداشت و به فروشگاه رفت.

فهرست شامل این موارد بود: ماکارونی، پنیر، گوجه‌فرنگی، خامه، قارچ، کره، سیر و چند ادویه.

اما مشکل اینجا بود که آرش تفاوت بعضی از مواد را نمی‌دانست.

او جلوی قفسهٔ ادویه‌ها ایستاد و به شیشه‌های رنگارنگ نگاه کرد. روی یکی نوشته بود فلفل سیاه، روی دیگری دارچین و روی سومی پودر زنجبیل.

با خودش گفت: «ادویه، ادویه است دیگر. احتمالاً هرکدام را بریزی، غذا خوشمزه‌تر می‌شود.»

خوشبختانه در این مرحله هنوز چیزی نخریده بود.

از فروشنده پرسید: «ببخشید، برای یک غذای ایتالیایی چه ادویه‌ای پیشنهاد می‌کنید؟»

فروشنده گفت: «بستگی دارد چه غذایی درست می‌کنید.»

آرش با اعتمادبه‌نفس جواب داد: «یک غذای خیلی حرفه‌ای. از آن‌هایی که توی رستوران‌ها سرو می‌کنند.»

فروشنده چند لحظه به او نگاه کرد و سپس ادویه‌های مناسب را معرفی کرد.

آرش تمام مواد را خرید، اما وقتی به خانه رسید متوجه شد یک قلم مهم را فراموش کرده است: ماکارونی.

او به کیسه‌های خرید نگاه کرد.

«چطور ممکنه مواد غذا رو بخرم ولی خود غذا رو فراموش کنم؟»

چند دقیقه بعد دوباره به فروشگاه برگشت.

این بار فروشنده او را شناخت و پرسید: «چیزی یادتان رفته؟»

آرش گفت: «نه، فقط برای اطمینان اومدم. می‌خواستم ببینم ماکارونی واقعاً لازمه یا می‌شه بدون اون هم ماکارونی درست کرد.»

فروشنده لبخند زد و یک بسته ماکارونی به او داد.

آرش به خانه برگشت، آستین‌هایش را بالا زد و پیش‌بند قدیمی مادرش را پوشید. روی پیش‌بند نوشته شده بود: «آشپزخانه، قلمرو من است.»

او آن را به نشانه‌ای از موفقیت تلقی کرد.

فصل سوم: نبرد با پیاز

ویدیوی آموزشی روی لپ‌تاپ باز بود. آشپز داخل تصویر با حرکاتی سریع و دقیق، مواد را خرد می‌کرد و داخل ماهیتابه می‌ریخت.

آرش به تختهٔ آشپزی نگاه کرد و یک پیاز برداشت.

«خب، اول پیاز.»

چاقو را برداشت و شروع به خرد کردن کرد. تکه‌های پیاز در اندازه‌های مختلف روی تخته پخش شدند. یکی آن‌قدر بزرگ بود که می‌شد به‌عنوان توپ کوچک از آن استفاده کرد و دیگری آن‌قدر ریز بود که به نظر می‌رسید قبلاً خرد شده است.

آرش شانه بالا انداخت.

«همه‌شون بالاخره پیازن.»

چند دقیقه بعد، چشم‌هایش شروع به سوزش کردند. او به یاد آورد که در ویدیوی آموزشی، آشپز با آرامش کار می‌کرد و حتی یک بار هم پلک نمی‌زد.

آرش زیر لب گفت: «این آدم اصلاً چشم داره؟»

شیر آب را باز کرد و صورتش را شست. سپس با یک عینک شنا به آشپزخانه برگشت.

وقتی دوباره به لپ‌تاپ نگاه کرد، تصویر آشپز با دیدن عینک شنا روی صورت آرش متوقف شده بود؛ یا دست‌کم آرش تصور می‌کرد که آشپز داخل ویدیو با او ارتباط برقرار کرده است.

او عینک را محکم‌تر کرد و گفت: «حالا دیگه نمی‌تونی شکستَم بدی، پیاز!»

فندق، گربهٔ خاکستری خانه، از گوشهٔ آشپزخانه به او نگاه می‌کرد. گربه سرش را کمی کج کرده بود و انگار داشت دربارهٔ وضعیت روانی صاحبش تصمیم می‌گرفت.

آرش پیازهای خردشده را داخل ماهیتابه ریخت. صدای جلزولز بلند شد و او با خوشحالی گفت: «دیدی؟ تا اینجا که همه‌چیز عالیه.»

در همان لحظه، متوجه شد که هنوز اجاق را روشن نکرده است.

چند ثانیه به ماهیتابه نگاه کرد.

سپس زیر لب گفت: «پس این صدا از کجا میاد؟»

صدای جلزولز از ماهیتابهٔ دیگری بود که از قبل روی شعله قرار داشت و آرش فراموش کرده بود خاموشش کند. داخل آن فقط کمی روغن باقی مانده بود که حالا بیش از حد داغ شده بود.

آرش با عجله شعله را خاموش کرد و تصمیم گرفت از این به بعد با دقت بیشتری کار کند.

فصل چهارم: ماکارونی فراری

مرحلهٔ بعدی، پختن ماکارونی بود.

آرش قابلمه‌ای بزرگ برداشت و آن را از آب پر کرد. ویدیوی آموزشی می‌گفت باید صبر کند تا آب به جوش بیاید. او قابلمه را روی اجاق گذاشت و منتظر ماند.

یک دقیقه گذشت.

دو دقیقه گذشت.

آرش کلافه شد.

«این آب چرا این‌قدر دیر می‌جوشه؟»

درب قابلمه را برداشت و داخل آن را نگاه کرد. البته با این کار، هیچ اتفاقی سریع‌تر نمی‌شد.

در همین زمان، تلفنش زنگ خورد. دوستش پیام داده بود:

«امروز میای بیرون؟»

آرش پاسخ داد:

«نه، دارم غذای حرفه‌ای درست می‌کنم.»

دوستش نوشت:

«تو؟ آشپزی؟»

آرش جواب داد:

«بهتره به استعدادهای ناشناختهٔ مردم احترام بذاری.»

وقتی سرش را بالا آورد، آب شروع به جوشیدن کرده بود. با هیجان بستهٔ ماکارونی را باز کرد و همهٔ آن را داخل قابلمه ریخت.

مشکل این بود که قابلمه برای این مقدار ماکارونی کوچک بود.

چند رشته بیرون ماندند و آرش تلاش کرد آن‌ها را با قاشق به داخل فشار بدهد. رشته‌ها خم می‌شدند، اما کاملاً داخل آب نمی‌رفتند.

او به فکر افتاد و قابلمهٔ بزرگ‌تری آورد. سپس با کمک قاشق و یک دستگیرهٔ پارچه‌ای، ماکارونی را به قابلمهٔ جدید منتقل کرد.

وقتی کارش تمام شد، آشپزخانه شبیه آزمایشگاهی شده بود که در آن آزمایش مهمی شکست خورده باشد.

اما آرش تسلیم نشد.

«اشکالی نداره. آشپزهای حرفه‌ای هم اشتباه می‌کنن.»

او این جمله را با صدای بلند گفت تا اگر کسی از پشت در صدایش را شنید، متوجه شود که همه‌چیز طبق برنامه پیش می‌رود.

فصل پنجم: راز ادویهٔ قهوه‌ای

حالا نوبت آماده کردن سس بود.

آرش کره را در ماهیتابه گذاشت، قارچ‌ها را اضافه کرد و سیر را خرد کرد. این بخش بهتر پیش می‌رفت. قارچ‌ها کم‌کم نرم شدند و بوی خوبی در آشپزخانه پیچید.

آرش با رضایت گفت: «بالاخره یک چیزی درست از آب دراومد.»

سپس به سراغ ادویه‌ها رفت.

روی میز چند شیشه قرار داشت. یکی از آن‌ها فلفل سیاه بود و دیگری دارچین. آرش برچسب‌ها را نگاه کرد، اما دستش جلوی نوشته‌ها را گرفته بود.

شیشهٔ قهوه‌ای را برداشت و کمی از آن داخل سس ریخت.

سپس شیشهٔ دیگری برداشت و مقداری از آن را هم اضافه کرد.

او با خودش فکر کرد: «هرچه ادویه بیشتر، طعم بهتر.»

چند دقیقه بعد، بوی عجیبی در آشپزخانه پیچید. آرش ابتدا تصور کرد که شاید غذا در حال خوشمزه‌تر شدن است، اما وقتی سس را هم زد، رنگ آن کمی تیره‌تر از چیزی شد که در ویدیو دیده بود.

او به صفحهٔ لپ‌تاپ نگاه کرد. آشپز داخل ویدیو سس روشنی آماده کرده بود.

آرش گفت: «شاید نور دوربینش فرق داره.»

قاشق کوچکی برداشت و مقدار کمی از سس را چشید.

چهره‌اش تغییر کرد.

طعم غذا ترکیبی عجیب از تندی، شیرینی و مزه‌ای بود که نمی‌توانست آن را تشخیص دهد.

آرش سریع به شیشه‌ها نگاه کرد.

یکی دارچین بود.

دیگری پودر شکلات داغ!

او به مدت چند ثانیه بی‌حرکت ماند.

«من چرا پودر شکلات رو کنار ادویه‌ها گذاشتم؟ اصلاً چرا پودر شکلات دارم؟»

در همین لحظه، فندق روی صندلی پرید و با کنجکاوی به ماهیتابه نگاه کرد.

آرش قاشق را جلوی گربه گرفت.

«فندق، تو به‌عنوان یکی از اعضای خانواده، موظفی نظر کارشناسی بدی.»

فندق بو کشید، یک قدم عقب رفت و با بی‌اعتنایی روی صندلی دراز کشید.

آرش قاشق را کنار گذاشت.

«باشه. معلومه که هنوز ذائقه‌ات به غذاهای سطح بالا عادت نکرده.»

فصل ششم: ورود مهمان ناخوانده

ساعت نزدیک شش عصر بود و مادر قرار بود حدود هفت به خانه برسد. آرش هنوز امیدوار بود که بتواند غذا را آماده کند.

او سس را کنار گذاشت و تصمیم گرفت از ابتدا یک سس ساده‌تر درست کند.

این بار شیشه‌ها را از هم جدا کرد و برچسب‌ها را با دقت خواند. همه‌چیز بهتر پیش می‌رفت تا اینکه زنگ در به صدا درآمد.

آرش از چشمی در نگاه کرد.

عمو بهرام بود؛ برادر پدرش که گاهی بدون خبر قبلی به خانه می‌آمد.

آرش در را باز کرد.

عمو بهرام با لبخند گفت: «سلام آشپز کوچولو! شنیدم امروز قراره شاهکار کنی.»

آرش با تعجب پرسید: «کی بهتون گفته؟»

عمو خندید.

«پدرت. گفته بود می‌خوای برای تولد مادرت شام درست کنی. گفتم بیام ببینم چه خبره.»

آرش فوراً راه را بست.

«نه، نه! هنوز آماده نیست. بهتره برید و یک ساعت دیگه برگردید.»

عمو بهرام از کنار او وارد شد.

«اتفاقاً من آشپزی رو خیلی دوست دارم. می‌تونم کمک کنم.»

آرش به آشپزخانه نگاه کرد و بعد به عمو.

اگر عمو بهرام وارد آشپزخانه می‌شد، احتمال داشت تمام ماجرا را بفهمد. اما شاید هم کمکش مفید بود.

آرش با تردید گفت: «فقط لطفاً چیزی رو به مامان نگید.»

عمو بهرام دستش را روی قلبش گذاشت.

«قول می‌دم.»

سپس وارد آشپزخانه شد، به ماهیتابه نگاه کرد و پرسید:

«این سس شکلاتیه؟»

آرش چشم‌هایش را بست.

«شما از کجا فهمیدید؟»

عمو قاشق را برداشت، کمی از سس را چشید و چند ثانیه سکوت کرد.

سپس گفت: «باید اعتراف کنم که در تمام عمرم چنین چیزی نخورده‌ام.»

آرش با امید پرسید: «یعنی خوبه؟»

عمو به سقف نگاه کرد.

«یعنی احتمالاً هیچ‌وقت فراموشش نمی‌کنم.»

نیلوفر کرایه را پرداخت کرد، چمدانش را برداشت و کلید را در قفل چرخاند.

در با صدای آرامی باز شد.

داخل خانه بوی چوب قدیمی و کاغذ می‌آمد. وسایل بیشترشان سر جای خود بودند؛ ساعت دیواری، میز کوچک کنار پنجره و قاب عکس خانوادگی که پدربزرگ همیشه آن را گردگیری می‌کرد.

نیلوفر به قاب نزدیک شد.

در عکس، خودش هشت‌ساله بود و کنار پدربزرگ ایستاده بود. هر دو لبخند می‌زدند و دست‌هایشان را روی دستهٔ یک دوچرخهٔ کوچک گذاشته بودند.

نیلوفر به یاد آورد که آن دوچرخه هدیهٔ تولدش بود. پدربزرگ چند هفته برای تعمیرش وقت گذاشته بود تا بتواند در روز تولد، آن را به او بدهد.

آن روز نیلوفر از خوشحالی تا غروب در حیاط دوچرخه‌سواری کرده بود. وقتی زمین خورد، پدربزرگ دستش را گرفت و گفت:

«اشکالی نداره. مهم اینه که دوباره بلند بشی.»

نیلوفر دستش را روی قاب عکس کشید.

«کاش بیشتر می‌اومدم، پدربزرگ.»

پاسخی نبود. فقط صدای ساعت دیواری در اتاق می‌پیچید.

او کیفش را کنار مبل گذاشت و شروع به مرتب‌کردن وسایل کرد. بیشتر چیزها ساده بودند: چند کتاب، لباس‌های قدیمی، ظروف آشپزخانه و جعبه‌ای از عکس‌های خانوادگی.

در اتاق پدربزرگ، کشوی میز قفل بود. نیلوفر کلید کوچکی را که به دستهٔ در آویزان بود امتحان کرد. قفل باز شد و کشو با صدای خشکی بیرون آمد.

داخل آن چند دفتر، یک عینک قدیمی و دسته‌ای نامه قرار داشت.

نیلوفر نامه‌ها را کنار زد و در انتهای کشو، کلید دیگری پیدا کرد. روی آن تکه‌کاغذی بسته شده بود که با دست‌خط پدربزرگ نوشته شده بود:

«برای چمدان آبی.»

نیلوفر اخم کرد.

چمدان آبی؟

در خانه چند چمدان قدیمی وجود داشت، اما او فقط یکی را به یاد می‌آورد؛ چمدان قهوه‌ای‌رنگی که پدربزرگ برای سفرهایش استفاده می‌کرد.

او از اتاق بیرون رفت و به انباری رسید. انباری کوچک و تاریک بود و وسایل زیادی در آن روی هم چیده شده بودند. نیلوفر چراغ را روشن کرد و شروع به جست‌وجو کرد.

پشت چند جعبهٔ مقوایی، چمدانی آبی‌رنگ پیدا کرد.

چمدان از نوع قدیمی بود؛ با گوشه‌های فلزی، دسته‌ای چرمی و قفلی کوچک که رنگش تیره شده بود.

نیلوفر کلید را در قفل گذاشت.

با یک صدای تق، قفل باز شد.

درون چمدان لباس یا وسایل سفر نبود. چند بسته نامه، دفترچه‌ای باریک، عکس‌هایی قدیمی و یک جعبهٔ چوبی کوچک در آن قرار داشتند. همه‌چیز با دقت مرتب شده بود، انگار صاحب چمدان می‌خواسته روزی کسی آن را پیدا کند.

نیلوفر اولین بستهٔ نامه‌ها را برداشت.

روی کاغذ بیرونی نوشته شده بود: «بهار ۱۳۵۸».

نامه‌ها با دست‌خطی متفاوت از دست‌خط پدربزرگ نوشته شده بودند. نیلوفر یکی از آن‌ها را باز کرد.

«رضای عزیزم،

امروز دوباره از کنار خانه‌تان گذشتم. مادرت گفت برای کار به شهر دیگری رفته‌ای و شاید تا چند ماه برنگردی. نمی‌دانم این نامه به دستت می‌رسد یا نه، اما نمی‌توانم تمام حرف‌هایی را که مانده‌اند ناگفته بگذارم.

یادت هست روزی که در ایستگاه قطار از هم خداحافظی کردیم؟ گفتی سفر کوتاه است و به‌زودی برمی‌گردی. من هم باور کردم. حالا هر بار صدای قطار را می‌شنوم، فکر می‌کنم شاید این بار تو باشی.

اگر برگشتی و من نبودم، بدان که هرگز از رفتنت دلگیر نشدم. می‌دانستم زندگی گاهی آدم‌ها را به راه‌هایی می‌برد که انتخابشان نکرده‌اند.

فقط دلم می‌خواست یک بار دیگر با هم زیر درخت توت بنشینیم و دربارهٔ روزهایی حرف بزنیم که خیال می‌کردیم همه‌چیز برای همیشه همان‌طور می‌ماند.

با مهر،
مریم»

نیلوفر نامه را پایین آورد.

نام رضا، نام کوچک پدربزرگش بود. اما مریم چه کسی بود؟

او نامه‌های بعدی را بیرون آورد. بعضی از آن‌ها پاسخ‌هایی از رضا بودند و بعضی دیگر نامه‌هایی از مریم. تاریخ‌ها نشان می‌دادند این مکاتبه سال‌ها ادامه داشته است.

در یکی از نامه‌ها، رضا نوشته بود:

«مریم عزیز،

امروز بالاخره کاری پیدا کردم. هنوز نمی‌دانم چه زمانی می‌توانم برگردم، اما هرچه باشد، نمی‌خواهم قولی بدهم که نتوانم به آن عمل کنم.

اگر زندگی اجازه داد، برمی‌گردم. اگر نه، امیدوارم روزی بفهمی که رفتنم به معنی فراموش‌کردنت نبود.

بعضی آدم‌ها حتی وقتی کنار ما نیستند، بخشی از زندگی ما باقی می‌مانند.»

نیلوفر به تاریخ نامه نگاه کرد. نامه پیش از ازدواج پدربزرگش نوشته شده بود.

او همیشه تصور کرده بود پدربزرگ از جوانی عاشق مادربزرگ بوده و هیچ داستان دیگری در زندگی‌اش نداشته است. حالا برای نخستین بار متوجه می‌شد که پیش از تشکیل خانواده، گذشته‌ای وجود داشته که هیچ‌وقت درباره‌اش چیزی نشنیده بود.

نیلوفر به سراغ دفترچه رفت.

صفحهٔ اول، نام «رضا» و تاریخی قدیمی را نشان می‌داد. نوشته‌ها ابتدا کوتاه بودند؛ دربارهٔ کار، سفر و نگرانی‌های روزانه. اما هرچه جلوتر می‌رفت، بیشتر دربارهٔ خاطرات و آدم‌هایی می‌نوشتند که در گذر زمان از زندگی او دور شده بودند.

در یکی از صفحه‌ها آمده بود:

«امروز فهمیدم آدم می‌تواند کسی را دوست داشته باشد و در عین حال، راه دیگری برای زندگی انتخاب کند. شاید این یکی از سخت‌ترین درس‌های بزرگ‌شدن باشد.

من و مریم برای هم آرزوهای زیادی داشتیم، اما شرایط زندگی ما را به دو مسیر متفاوت برد. سال‌ها بعد با زنی آشنا شدم که مادر فرزندانم شد و زندگی تازه‌ای را آغاز کردم. هرگز از آن زندگی پشیمان نبودم.

اما بعضی خاطره‌ها را نمی‌شود از زندگی بیرون کرد. آن‌ها بخشی از چیزی هستند که ما را ساخته است.»

نیلوفر دفترچه را بست.

ناگهان احساس کرد پدربزرگش را از زاویه‌ای تازه می‌شناسد. او فقط پیرمرد مهربانی نبود که برایش چای می‌ریخت و داستان تعریف می‌کرد. او جوانی بوده با امیدها، تصمیم‌های دشوار و آرزوهایی که بعضی از آن‌ها هیچ‌وقت به حقیقت نرسیده بودند.

نیلوفر جعبهٔ چوبی را باز کرد.

داخل آن یک عکس کوچک، یک بلیت قطار قدیمی و روبانی آبی قرار داشت. عکس، تصویر زنی جوان را نشان می‌داد که کنار درختی ایستاده بود. پشت عکس نوشته شده بود:

«برای رضا؛ از مریم، به یاد روزهای خوب.»

نیلوفر مدتی طولانی به عکس نگاه کرد.

در انتهای چمدان، پاکتی جداگانه قرار داشت. روی آن نام نیلوفر نوشته شده بود.

دست‌هایش لرزیدند.

پاکت را باز کرد.

«نیلوفر عزیزم،

اگر این نامه را می‌خوانی، یعنی چمدان آبی را پیدا کرده‌ای.

مدت‌ها فکر می‌کردم باید این خاطره‌ها را برای خودم نگه دارم. نمی‌خواستم کسی فکر کند گذشته‌ام را بیشتر از زندگی‌ای که با خانواده‌ام داشتم دوست داشته‌ام. اما با گذشت زمان فهمیدم پنهان‌کردن گذشته همیشه به معنی محافظت از دیگران نیست. گاهی فقط باعث می‌شود بخشی از زندگی ما ناشناخته بماند.

من در جوانی دوستی داشتم به نام مریم. ما خیال‌های زیادی برای آینده داشتیم، اما زندگی همیشه طبق برنامهٔ ما پیش نمی‌رود. راه‌های ما از هم جدا شد و هر کدام زندگی خودمان را ساختیم.

من با مادربزرگت خوشبخت بودم. او بهترین همراه زندگی‌ام بود و هیچ‌وقت لازم ندیدم خودم را بابت گذشته سرزنش کنم. اما این به آن معنی نیست که آن روزها را فراموش کرده‌ام.

آدم می‌تواند به گذشته احترام بگذارد و در زمان حال زندگی کند.

این چمدان را نگه داشتم تا اگر روزی یکی از اعضای خانواده خواست بداند من پیش از آنکه پدربزرگش شوم چه کسی بوده‌ام، چیزی برایش باقی مانده باشد.

نیلوفرم، یک چیز دیگر هم هست که می‌خواهم به تو بگویم.

من می‌دانم چقدر سرت شلوغ است. می‌دانم ساختن آینده به زمان و تلاش زیادی نیاز دارد. اما یادت نرود که آدم‌ها همیشه برای دیدن تو فرصت نامحدود ندارند.

وقتی کوچک بودی، هر بار که می‌خواستی بروی، از من قول می‌گرفتی که تابستان بعد هم منتظرت باشم. من هم قول می‌دادم.

بیشتر وقت‌ها به قولم عمل کردم. اما هیچ‌وقت نمی‌دانستم آخرین تابستان کدام است.

اگر روزی از کسی دور شدی، سعی کن پیش از آنکه فاصله زیاد شود، برای دیدنش قدمی برداری. نه از روی ترس، بلکه چون رابطه‌ها ارزش مراقبت‌کردن دارند.

و اگر از گذشته‌ات چیزی پیدا کردی که تو را غمگین کرد، آن را نشانهٔ شکست ندان. خاطره‌ها گاهی درد دارند، چون زمانی برای ما ارزشمند بوده‌اند.

این چمدان را به تو می‌سپارم؛ نه برای آنکه تمام روزهایت را صرف نگاه‌کردن به گذشته کنی، بلکه برای آنکه بدانی زندگی هر آدمی داستانی طولانی‌تر از چیزی دارد که در ظاهر می‌بینیم.

با عشق،
پدربزرگت، رضا»

وقتی نیلوفر به پایان نامه رسید، اشک روی گونه‌هایش جاری شده بود.

او نامه را به سینه‌اش فشرد و به یاد آخرین تماس پدربزرگ افتاد. آن روز پدربزرگ پرسیده بود چه زمانی می‌آید و او مثل همیشه گفته بود به‌زودی.

حالا می‌فهمید که پدربزرگ حتی در آخرین روزهای زندگی‌اش می‌خواسته او را ببیند؛ نه برای گفتن حرفی بزرگ، بلکه شاید فقط برای نشستن کنار هم و نوشیدن یک فنجان چای.

نیلوفر روی زمین انباری نشست و نامه‌ها را یکی‌یکی مرتب کرد. بیرون، صدای پرنده‌ها از حیاط می‌آمد و نور غروب از پنجرهٔ کوچک انباری وارد می‌شد.

او نمی‌توانست زمان را برگرداند. نمی‌توانست به تابستان‌های گذشته برگردد یا دوباره دست پدربزرگ را بگیرد و از او بخواهد داستانی دیگر تعریف کند.

اما می‌توانست کاری انجام دهد.

چمدان را به اتاق آورد و نامه‌ها را با دقت داخل آن گذاشت. تصمیم گرفت آن‌ها را اسکن کند و نسخه‌ای برای اعضای خانواده آماده کند تا داستان پدربزرگ فراموش نشود.

بعد از آن، به مادرش زنگ زد.

وقتی مادر پاسخ داد، نیلوفر گفت:

«مامان، می‌خوام امشب باهات حرف بزنم. نه دربارهٔ کار و نه دربارهٔ خونه. فقط می‌خوام بشینیم و حرف بزنیم.»

مادرش لحظه‌ای سکوت کرد و بعد گفت:

«من هم دلم می‌خواست همین کار رو بکنیم.»

آن شب، آن دو کنار پنجره نشستند. نیلوفر چمدان آبی را روی میز گذاشت و داستان نامه‌ها را تعریف کرد. مادرش عکس مریم را دید و از پدربزرگ خاطره‌هایی گفت که نیلوفر هیچ‌وقت نشنیده بود.

آن‌ها تا دیروقت حرف زدند؛ دربارهٔ گذشته، دربارهٔ خانواده و دربارهٔ روزهایی که هر کدامشان فکر می‌کردند وقت زیادی برای انجام کارهای ساده باقی مانده است.

صبح روز بعد، نیلوفر به حیاط رفت.

درخت توت هنوز سر جایش بود. شاخه‌هایش پیرتر شده بودند و تنه‌اش ترک‌های عمیقی داشت، اما ریشه‌هایش همچنان در خاک محکم بودند.

نیلوفر زیر درخت نشست و دفترچه‌اش را باز کرد. در صفحهٔ اول نوشت:

«چمدان خاطرات»

سپس ادامه داد:

«هر خانواده چمدانی نامرئی دارد؛ پر از داستان‌هایی که گفته شده‌اند و داستان‌هایی که سال‌ها در سکوت مانده‌اند. بعضی از آن‌ها شیرین‌اند، بعضی غمگین و بعضی آن‌قدر معمولی به نظر می‌رسند که کسی فکر نمی‌کند روزی ارزش نگه‌داشتن داشته باشند.

اما وقتی زمان می‌گذرد، همین لحظه‌های معمولی به چیزهایی تبدیل می‌شوند که دلمان برایشان تنگ می‌شود.

من نمی‌توانم گذشته را عوض کنم. نمی‌توانم روزهایی را که کنار پدربزرگم نبودم دوباره به دست بیاورم.

اما می‌توانم داستانش را نگه دارم.

می‌توانم از امروز به بعد، برای آدم‌هایی که دوستشان دارم وقت بگذارم. می‌توانم تماس‌ها را بی‌دلیل به فردا موکول نکنم و وقتی کسی از خاطراتش حرف می‌زند، با حوصله گوش بدهم.

شاید این بهترین راه برای نگه‌داشتن کسانی باشد که دیگر کنارمان نیستند؛ اینکه خوبی‌هایی را که به ما آموخته‌اند، در زندگی خودمان ادامه بدهیم.»

نیلوفر دفترچه را بست.

بعد از ظهر، وقتی آمادهٔ بازگشت شد، چمدان آبی را با خود برداشت. تصمیم گرفته بود آن را در خانهٔ خودش نگه دارد؛ نه در گوشه‌ای تاریک و فراموش‌شده، بلکه جایی که هر وقت دلش برای پدربزرگ تنگ شد، بتواند نامه‌ها را بخواند و دوباره صدای او را در ذهنش بشنود.

پیش از خروج، یک بار دیگر به خانه نگاه کرد.

خانه‌ای که سال‌ها برایش فقط محل تعطیلات تابستانی بود، حالا معنای دیگری داشت. در دیوارهایش داستان‌هایی پنهان شده بود؛ داستان عشق، انتخاب، دلتنگی و گذر زمان.

نیلوفر در را بست و کلید را به صاحب جدید خانه سپرد.

وقتی به ایستگاه رسید، قطار هنوز نیامده بود. او روی نیمکت نشست و چمدان را کنار پاهایش گذاشت.

تلفنش زنگ خورد. مادرش بود.

«رسیدی ایستگاه؟»

نیلوفر لبخند زد.

«آره، مامان. منتظر قطارم.»

مادر گفت: «وقتی رسیدی، خبر بده.»

نیلوفر پاسخ داد: «حتماً. امشب هم بهت زنگ می‌زنم. می‌خوام ادامهٔ داستان‌هایی رو که دربارهٔ پدربزرگ گفتی بشنوم.»

بعد از پایان تماس، نیلوفر به آسمان نگاه کرد. ابرها کنار رفته بودند و نور آفتاب روی ریل‌ها می‌درخشید.

چمدان آبی کنار او بود؛ پر از نامه‌هایی که سال‌ها در سکوت مانده بودند.

نیلوفر دستش را روی دستهٔ چرمی چمدان گذاشت و با خودش فکر کرد شاید هیچ‌وقت برای فهمیدن گذشته دیر نباشد، اما برای ساختن خاطره‌های تازه بهتر است بیش از حد منتظر نمانیم.

قطار از دور پیدا شد.

نیلوفر بلند شد، چمدان را برداشت و به سمت سکو رفت.

این بار، وقتی قطار حرکت کرد، او احساس نمی‌کرد که فقط از شهری قدیمی دور می‌شود.

احساس می‌کرد بخشی از گذشته را با خود می‌برد؛ نه برای زندگی‌کردن در آن، بلکه برای اینکه در مسیر آینده، آن را فراموش نکند.

    body: `
پروفسور نادر معتقد بود دنیا فقط به یک چیز نیاز دارد: اختراعی که همهٔ مشکلات را حل کند.

او این جمله را آن‌قدر تکرار کرده بود که همسایه‌ها، فروشندهٔ محل و حتی رانندهٔ تاکسی محله هم آن را حفظ شده بودند.

هر وقت کسی از او می‌پرسید این اختراع چه زمانی آماده می‌شود، پروفسور عینکش را روی بینی جابه‌جا می‌کرد و با اعتمادبه‌نفس می‌گفت:

«خیلی زود! فقط چند آزمایش کوچک باقی مانده.»

مشکل این بود که آن چند آزمایش کوچک معمولاً باعث می‌شد چراغ‌های خانه خاموش شوند، صدای عجیبی از زیرزمین بلند شود یا یکی از وسایل آشپزخانه به شکلی غیرقابل‌توضیح از کار بیفتد.

پروفسور نادر در خانه‌ای قدیمی زندگی می‌کرد که زیرزمین بزرگی داشت. او زیرزمین را به آزمایشگاه تبدیل کرده بود. روی دیوارها نقشه‌های پیچیده نصب شده بود، روی میزها ابزارهای مختلف قرار داشت و در گوشهٔ اتاق، چند دستگاه دیده می‌شد که حتی خود پروفسور هم گاهی فراموش می‌کرد برای چه ساخته شده‌اند.

درِ آزمایشگاه همیشه قفل بود، اما نه برای محافظت از اختراعات؛ بلکه برای جلوگیری از ورود گربهٔ همسایه که علاقهٔ عجیبی به خوابیدن روی کاغذهای طراحی داشت.

تنها کسی که اجازه داشت وارد آزمایشگاه شود، خواهرزادهٔ پروفسور، پسری دوازده‌ساله به نام آرش بود.

آرش به علم علاقه داشت، اما از نظر او بهترین اختراع دنیا چیزی بود که بتواند تکالیف مدرسه را خودش انجام دهد.

یک روز عصر، آرش وارد آزمایشگاه شد و دید پروفسور پشت میز بزرگی ایستاده است. روپوش سفید پوشیده بود و موهایش به شکلی نامرتب از زیر کلاه بیرون زده بودند.

روی میز دستگاهی قرار داشت که از چند لوله، یک صفحه‌نمایش کوچک، دو چراغ رنگی و دکمه‌ای بزرگ تشکیل شده بود.

آرش پرسید:

«این یکی دیگه چیه؟»

پروفسور دست‌هایش را به هم مالید.

«آرش عزیزم، با دستگاهی روبه‌رو هستی که آیندهٔ بشر را تغییر خواهد داد!»

آرش به دستگاه نگاه کرد.

«می‌تونه تکالیف من رو انجام بده؟»

پروفسور مکث کرد.

«خب... نه دقیقاً.»

«می‌تونه اتاقم رو مرتب کنه؟»

«هنوز نه.»

«می‌تونه برام ساندویچ درست کنه؟»

پروفسور با ناراحتی گفت:

«تو چرا همیشه به چیزهای کوچک فکر می‌کنی؟ این دستگاه قرار است مشکلات بزرگ بشریت را حل کند!»

آرش شانه بالا انداخت.

«من فعلاً مشکل بزرگم مشق ریاضیه.»

پروفسور تصمیم گرفت به‌جای بحث‌کردن، اختراعش را معرفی کند.

«نام این دستگاه، سامانهٔ هوشمند بهینه‌سازی امور روزمره است. البته اسم کوتاهش را گذاشته‌ام "همه‌چی‌درست‌کن"!»

آرش چند لحظه سکوت کرد.

«اسمش از خودش طولانی‌تره.»

پروفسور وانمود کرد که نشنیده است.

او توضیح داد که دستگاه با دریافت فرمان می‌تواند کارهای مختلف را انجام دهد. اگر کسی خسته باشد، برایش برنامهٔ استراحت تنظیم می‌کند. اگر اتاقی نامرتب باشد، وسایل را مرتب می‌کند. اگر کسی چیزی گم کرده باشد، تلاش می‌کند آن را پیدا کند.

آرش پرسید:

«از کجا می‌فهمه چی باید بکنه؟»

پروفسور با افتخار به صفحه‌نمایش اشاره کرد.

«با الگوریتم پیشرفته‌ای که خودم طراحی کرده‌ام!»

آرش روی صفحه نوشته‌ای دید:

«حالت خودکار: فعال.»

زیر آن سه گزینه وجود داشت:

۱. سریع
۲. دقیق
۳. فوق‌العاده هوشمند

آرش گفت:

«من اگه جای تو بودم، اول حالت دقیق رو امتحان می‌کردم.»

پروفسور سینه‌اش را جلو داد.

«دانشمندان واقعی از حالت فوق‌العاده هوشمند استفاده می‌کنند!»

او دکمهٔ سوم را فشار داد.

دستگاه صدای کوتاهی تولید کرد. چراغ سبز روشن شد، صفحه‌نمایش چشمک زد و صدای ماشینی گفت:

«سلام، کاربر محترم. لطفاً مشکل خود را بیان کنید.»

پروفسور با هیجان گفت:

«من می‌خواهم تمام مشکلات زندگی را حل کنم.»

دستگاه چند لحظه سکوت کرد.

سپس پاسخ داد:

«درخواست بسیار گسترده است. لطفاً مشکل مشخصی انتخاب کنید.»

آرش خندید.

«حتی دستگاه هم می‌گه دقیق‌تر حرف بزن!»

پروفسور اخم کرد.

«بسیار خب. مشکل مشخص: خانهٔ من نامرتب است. آن را مرتب کن.»

دستگاه صدایی شبیه زنگ ساعت تولید کرد و گفت:

«فرمان دریافت شد. عملیات مرتب‌سازی آغاز می‌شود.»

چند ثانیه هیچ اتفاقی نیفتاد.

بعد ناگهان دستگاه روشن‌تر شد و صدای چرخش موتور از داخل آن بلند شد.

جعبه‌های روی زمین شروع به لرزیدن کردند. یک بازوی فلزی از کنار میز بیرون آمد و به سمت انبوه کاغذها رفت.

آرش با نگرانی گفت:

«پروفسور، مطمئنی این بازو باید این‌طوری حرکت کنه؟»

پروفسور گفت:

«کاملاً! این دستگاه از هوش مصنوعی پیشرفته استفاده می‌کند.»

بازوی فلزی دسته‌ای از کاغذها را برداشت و داخل سطل انداخت.

پروفسور فریاد زد:

«نه! اون‌ها نقشه‌های اصلی من بودن!»

دستگاه پاسخ داد:

«کاغذهای پراکنده با موفقیت جمع‌آوری شدند.»

سپس به سراغ میز رفت. مدادها، پیچ‌گوشتی‌ها و چند قطعهٔ کوچک را برداشت و همه را داخل یک جعبه ریخت.

آرش گفت:

«خب، حداقل میز مرتب شد.»

اما هنوز جمله‌اش تمام نشده بود که دستگاه به سمت قفسه رفت و تمام کتاب‌ها را از آن بیرون کشید.

«کتاب‌ها در محل نامناسب قرار داشتند. در حال انتقال به محل بهینه.»

بازوی فلزی کتاب‌ها را روی زمین گذاشت و سپس جعبهٔ ابزار را روی قفسه چید.

پروفسور با وحشت دکمهٔ توقف را فشار داد.

هیچ اتفاقی نیفتاد.

دستگاه گفت:

«درخواست توقف رد شد. عملیات مرتب‌سازی هنوز کامل نشده است.»

آرش به صفحه‌نمایش اشاره کرد.

«شاید باید برقش رو قطع کنیم!»

پروفسور به طرف پریز رفت، اما کابل دستگاه پشت میز گیر کرده بود. وقتی بالاخره دوشاخه را بیرون کشید، دستگاه خاموش شد.

آزمایش اول به پایان رسیده بود.

آزمایشگاه از قبل نامرتب‌تر شده بود.

پروفسور روی صندلی نشست و زیر لب گفت:

«یک اشکال کوچک در الگوریتم وجود دارد.»

آرش به کاغذهای پاره‌شده نگاه کرد.

«اگه این اشکال کوچیکه، نمی‌خوام اشکال بزرگش رو ببینم.»

با این حال، پروفسور از شکست دلسرد نشد. او دستگاه را دوباره تنظیم کرد و این بار تصمیم گرفت آن را در کاری ساده‌تر امتحان کند.

صبح روز بعد، وقتی آرش برای مدرسه آماده می‌شد، پروفسور او را صدا زد.

«آرش! امروز فرصت داری شاهد یک پیشرفت تاریخی باشی.»

آرش کیفش را روی شانه انداخت.

«اگه پیشرفت تاریخی باعث بشه دیر به مدرسه برسم، ترجیح می‌دم شاهدش نباشم.»

پروفسور گفت:

«این بار دستگاه قرار است صبحانه آماده کند!»

آرش بلافاصله کیفش را زمین گذاشت.

«چرا از اول نگفتی؟»

آن دو به آشپزخانه رفتند. پروفسور دستگاه را کنار میز قرار داد و یک ظرف خالی جلوی آن گذاشت.

«همه‌چی‌درست‌کن، برای دو نفر صبحانه آماده کن.»

دستگاه گفت:

«لطفاً نوع صبحانه را مشخص کنید.»

پروفسور جواب داد:

«یک صبحانهٔ کامل و مقوی.»

«مواد غذایی موجود شناسایی می‌شوند.»

دستگاه شروع به بررسی آشپزخانه کرد. بازویش به سمت یخچال رفت، در آن را باز کرد و چند تخم‌مرغ، مقداری پنیر و یک بسته شیر بیرون آورد.

آرش با تعجب گفت:

«تا اینجا که خوبه!»

دستگاه تخم‌مرغ‌ها را داخل یک کاسه گذاشت، شیر را کنار آن ریخت و پنیر را هم اضافه کرد.

پروفسور با نگرانی گفت:

«صبر کن! هنوز قرار نبود همه‌چیز رو با هم مخلوط کنی!»

دستگاه پاسخ داد:

«برای تهیهٔ صبحانهٔ کامل، ترکیب مواد مختلف ضروری است.»

سپس ظرف را برداشت و به سمت دستگاه مخلوط‌کن رفت.

آرش فریاد زد:

«نه! این صبحانه نیست، پروژهٔ آزمایشگاه شیمیه!»

اما دیگر دیر شده بود. مخلوط‌کن روشن شد و مواد را به مایعی زردرنگ تبدیل کرد.

دستگاه مایع را داخل یک لیوان ریخت و اعلام کرد:

«صبحانه آماده است. نوش جان!»

پروفسور به لیوان خیره شد.

آرش پرسید:

«خودت می‌خوری؟»

پروفسور سرفه‌ای کرد.

«من به‌عنوان مخترع، باید ابتدا ایمنی محصول را بررسی کنم.»

آرش لبخند زد.

«پس بفرما.»

پروفسور لیوان را برداشت، کمی بو کرد و دوباره روی میز گذاشت.

«بهتر است آزمایش چشایی را به مرحلهٔ بعد موکول کنیم.»

آن روز هر دو با نان و پنیر معمولی صبحانه خوردند.

بااین‌حال، پروفسور متوجه یک نکته شده بود: دستگاه برای اجرای فرمان‌ها به دستورهای دقیق‌تری نیاز داشت.

او تا شب مشغول تغییر برنامه شد. در پایان، روی صفحهٔ دستگاه پیامی ظاهر شد:

«نسخهٔ جدید آماده است.»

پروفسور لبخند زد.

«این بار دیگر هیچ مشکلی وجود ندارد.»

آرش گفت:

«این جمله رو دیروز هم گفتی.»

«این بار مطمئنم!»

پروفسور تصمیم گرفت آخرین آزمایش را در میدان کوچک محله انجام دهد. قرار بود دستگاه بتواند مشکلات روزمرهٔ مردم را برطرف کند. اگر موفق می‌شد، شاید شهرداری از او برای ساخت نسخه‌ای بزرگ‌تر دعوت می‌کرد.

روز بعد، دستگاه را با چرخ‌دستی به میدان بردند. چند نفر از همسایه‌ها هم برای تماشا جمع شدند.

خانم رضایی، همسایهٔ طبقهٔ بالا، اولین نفر بود که جلو آمد.

«آقای پروفسور، می‌گن دستگاه شما همه‌چی رو درست می‌کنه. می‌تونه خریدهای من رو تا خونه بیاره؟»

پروفسور با افتخار گفت:

«البته!»

خانم رضایی چند کیسهٔ خرید کنار دستگاه گذاشت.

دستگاه آن‌ها را برداشت و به طرف خانهٔ او حرکت کرد. تا اینجا همه‌چیز خوب پیش می‌رفت.

اما وقتی به در ساختمان رسید، کیسه‌ها را کنار در گذاشت و اعلام کرد:

«انتقال خریدها کامل شد.»

خانم رضایی گفت:

«خب، حالا یکی باید این‌ها رو تا طبقهٔ سوم ببره!»

دستگاه پاسخ داد:

«فرمان اولیه شامل استفاده از پله‌ها نبود.»

خانم رضایی به پروفسور نگاه کرد.

«اختراعتون خیلی باهوشه، ولی انگار از زندگی چیزی نمی‌دونه!»

پروفسور با عجله دستگاه را به میدان برگرداند.

مرد بعدی، آقای شریفی، درخواست کرد دستگاه دوچرخهٔ خرابش را تعمیر کند. دستگاه دوچرخه را بررسی کرد، چرخ‌ها را چرخاند و گفت:

«مشکل شناسایی شد. چرخ جلو به تنظیم نیاز دارد.»

بازوی فلزی بیرون آمد و شروع به کار کرد.

چند لحظه بعد، چرخ جلو درست شده بود.

آقای شریفی خوشحال شد.

«آفرین! بالاخره یه کار درست انجام داد!»

اما دستگاه ادامه داد:

«برای افزایش پایداری، چرخ عقب نیز باید تنظیم شود.»

سپس چرخ عقب را باز کرد و کنار دوچرخه گذاشت.

آقای شریفی با ناراحتی گفت:

«من می‌خواستم دوچرخه‌ام درست بشه، نه اینکه نصفش رو تحویل بگیرم!»

جمعیت خندید.

پروفسور پیشانی‌اش را پاک کرد.

در همین هنگام، شهردار محله از راه رسید. او مردی بود که همیشه لباس رسمی می‌پوشید و برای هر اتفاقی یک سخنرانی آماده داشت.

شهردار پرسید:

«این ازدحام برای چیست؟»

پروفسور گفت:

«جناب شهردار، دستگاه من می‌تواند مشکلات شهر را حل کند.»

شهردار که به دنبال فرصتی برای تبلیغات بود، بلافاصله گفت:

«پس بسیار عالی! لطفاً مشکل ترافیک این میدان را حل کنید.»

پروفسور لحظه‌ای مکث کرد.

«البته... باید ابتدا شرایط را بررسی کنیم.»

اما شهردار به دستگاه اشاره کرد.

«همه‌چی‌درست‌کن، ترافیک را حل کن!»

دستگاه پاسخ داد:

«فرمان دریافت شد.»

ابتدا چند چراغ کوچک روی بدنه روشن شدند. سپس صفحه‌نمایش نوشت:

«تحلیل وضعیت ترافیک.»

دستگاه به ماشین‌های پارک‌شده نگاه کرد، مسیرهای عبور عابران را بررسی کرد و سرانجام اعلام کرد:

«برای حذف ترافیک، تعداد وسایل نقلیه باید کاهش یابد.»

پروفسور لبخند زد.

«خب، این که منطقیه.»

صبح‌ها زود بیدار می‌شدند و به ساحل می‌رفتند. ظهرها زیر سایهٔ درختان ناهار می‌خوردند و عصرها در کوچه‌ها دوچرخه‌سواری می‌کردند.

برای ساختن قلعهٔ شنی، یک سطل بزرگ از خانه آوردند. سام نقشه‌ای کشید که شامل برج‌ها، دیوارها و یک خندق دور قلعه بود. آراد مسئول آب آوردن شد، اما بیشتر آب را پیش از رسیدن به محل ساخت‌وساز روی پاهای خودش می‌ریخت.

در پایان روز، قلعه‌شان نه بزرگ‌ترین قلعهٔ دنیا بود و نه حتی بزرگ‌ترین قلعهٔ ساحل.

اما آن‌ها کنار آن عکس گرفتند و اسمش را گذاشتند «قصر دو پادشاه».

شب، عکس را به دیوار اتاق سام چسباندند.

روزهای دیگر هم گذشتند.

آن‌ها به فانوس دریایی رفتند و از پله‌های بلندش بالا رفتند. از آن بالا، دریا مثل صفحه‌ای بی‌پایان از شیشهٔ آبی دیده می‌شد.

سام گفت:

«وقتی بزرگ شدیم، باید دوباره بیایم اینجا.»

آراد جواب داد:

«وقتی بزرگ شدیم، هر تابستون میایم.»

سام لبخند زد.

«قول؟»

آراد دستش را جلو برد.

«قول.»

دست‌هایشان را به هم زدند؛ همان‌طور که همیشه بعد از توافق‌های مهمشان انجام می‌دادند.

اما روزها، برخلاف قول‌ها، منتظر کسی نمی‌مانند.

کم‌کم هوا تغییر کرد. شب‌ها خنک‌تر شدند و مغازه‌ها کم‌کم لوازم مدرسه را پشت ویترین گذاشتند.

یک روز صبح، آراد برای بردن فهرست تابستان به خانهٔ سام رفت. در حیاط باز بود و چند جعبه کنار در ورودی قرار داشت.

مادر سام داشت ظرف‌ها را داخل روزنامه می‌پیچید.

آراد پرسید:

«سام کجاست؟»

مادرش به طبقهٔ بالا اشاره کرد.

«اتاقشه. داره وسایلش رو مرتب می‌کنه.»

آراد به اتاق رفت.

سام روی زمین نشسته بود و کتاب‌هایش را داخل یک کارتن می‌گذاشت. روی دیوار، جای خالی عکس قلعهٔ شنی دیده می‌شد.

آراد کاغذ برنامه را بالا گرفت.

«هنوز دو تا کار مونده.»

سام لبخند کم‌رنگی زد.

«می‌دونم.»

«پس باید انجامشون بدیم.»

آن دو به ساحل رفتند. آن روز باد شدیدی می‌وزید و موج‌ها تا نزدیکی دیوار ساحلی بالا می‌آمدند. نتوانستند شنا کنند، اما کنار فانوس دریایی نشستند و از آدم‌هایی حرف زدند که روزی می‌خواستند بشوند.

سام گفت می‌خواهد معمار شود و ساختمان‌هایی طراحی کند که مردم از دیدنشان خوشحال شوند.

آراد گفت هنوز تصمیم نگرفته، اما دوست دارد کاری انجام دهد که باعث شود دیگران او را به یاد بیاورند.

سام با خنده گفت:

«پس باید یه مجسمه از خودت بسازی.»

آراد یک مشت شن به طرفش پرتاب کرد.

بعد از مدتی سکوت، سام از جیبش پاکتی بیرون آورد.

«این رو بعداً باز کن.»

آراد پاکت را گرفت.

«چیه؟»

«نامه‌ست. برای وقتی که دلت برام تنگ شد.»

آراد اخم کرد.

«من که قرار نیست دلم برات تنگ بشه.»

سام چیزی نگفت. فقط به دریا نگاه کرد.

آن شب، آراد نامه را باز نکرد. پاکت را داخل کشوی میزش گذاشت و تصمیم گرفت روز رفتن سام آن را بخواند.

روز آخر تابستان، آسمان از صبح ابری بود.

ماشین خانوادهٔ سام جلوی خانه ایستاده بود. چمدان‌ها در صندوق عقب قرار گرفته بودند و پدر سام آخرین جعبه را داخل ماشین گذاشت.

آراد کنار در ایستاده بود و نمی‌دانست چه بگوید.

سام با کوله‌پشتی از خانه بیرون آمد. برای چند لحظه هر دو فقط به هم نگاه کردند.

بعد سام گفت:

«خب، تابستون تموم شد.»

آراد تلاش کرد لبخند بزند.

«تابستون بعدی می‌بینمت.»

سام سر تکان داد.

«تابستون بعدی.»

آن‌ها یکدیگر را در آغوش گرفتند؛ آغوشی کوتاه و محکم، شبیه خداحافظی‌هایی که هیچ‌کدامشان دوست نداشتند طولانی شوند.

سام سوار ماشین شد.

پنجره را پایین کشید و دستش را بیرون آورد.

«یادت نره نامه رو بخونی!»

آراد جواب داد:

«تو هم یادت نره قولمون رو!»

ماشین حرکت کرد.

آراد تا انتهای خیابان به آن نگاه کرد. وقتی ماشین از پیچ گذشت و ناپدید شد، هنوز همان‌جا ایستاده بود.

باد سردی وزید و برگ‌های خشک کنار جدول را حرکت داد.

آن روز برای اولین بار فهمید بعضی اتفاق‌ها با اینکه می‌دانی قرار است رخ بدهند، باز هم وقتی اتفاق می‌افتند، غافلگیرت می‌کنند.

عصر، آراد به اتاقش رفت و پاکت را از کشو بیرون آورد.

روی آن نوشته شده بود:

«برای آراد؛ وقتی تابستان تمام شد.»

نامه را باز کرد.

نمی‌دانم وقتی این نامه را می‌خوانی کجا هستی. شاید توی اتاقت نشسته باشی، شاید هم دوباره کنار ساحل رفته باشی.

راستش من از رفتن می‌ترسم. نه از شهر جدید، نه از مدرسهٔ جدید. بیشتر از این می‌ترسم که روزی آن‌قدر گرفتار زندگی شویم که دیگر برای حرف زدن با هم وقت نداشته باشیم.

من نمی‌خواهم دوستی‌مان فقط به خاطرات کودکی تبدیل شود.

می‌خواهم وقتی بزرگ شدیم، هنوز بتوانیم دربارهٔ چیزهای مسخره بخندیم. هنوز بتوانیم از هم سؤال بپرسیم و جواب‌های عجیب بدهیم. هنوز بتوانیم کنار دریا بنشینیم و فکر کنیم دنیا چقدر بزرگ است.

اگر یک روز از من عصبانی شدی، بهم بگو.
اگر یک روز ناراحت بودی، بهم بگو.
اگر موفق شدی و خوشحال بودی، حتماً بهم بگو.

من هم همین کار را می‌کنم.

یادت هست کنار فانوس دریایی قول دادیم هر تابستان برگردیم؟

من به آن قول پایبندم.

شاید نتوانیم هر بار دقیقاً همان روزها را تکرار کنیم، اما می‌توانیم برای هم وقت بگذاریم.

راستی، من آن صدفی را که پیدا کردیم نگه داشته‌ام. همان صدف سفید که یک طرفش ترک کوچکی داشت. هر وقت آن را می‌بینم، یاد قلعهٔ شنی‌مان می‌افتم.

قلعه‌ای که موج‌ها خرابش کردند، ولی ما دوباره ساختیمش.

فکر می‌کنم دوستی هم همین‌طور است. ممکن است فاصله، روزهای سخت یا حتی اشتباه‌های خودمان آن را خراب کند. اما اگر هر دو بخواهیم، می‌توانیم دوباره بسازیمش.

پس این قول را فراموش نکن:

دوستی‌مان را به حال خودش رها نکن.

از طرف کسی که هنوز فکر می‌کند روزی با ماشین قدیمی‌اش تو را به تمام شهرهای ساحلی خواهد برد،

سام»

آراد نامه را چند بار خواند.

بعد آن را تا کرد و داخل همان کشو گذاشت.

روزهای مدرسه شروع شدند. آراد دوباره با هم‌کلاسی‌هایش وقت می‌گذراند و کم‌کم به برنامهٔ تازه عادت کرد. سام هم در شهر جدید مدرسه‌اش را شروع کرد.

آن‌ها در ابتدا هر روز با هم تماس می‌گرفتند. دربارهٔ معلم‌ها، کلاس‌ها و آدم‌های جدید حرف می‌زدند. گاهی تا دیروقت بازی می‌کردند و گاهی فقط دربارهٔ اتفاق‌های کوچک روزشان صحبت می‌کردند.

اما زندگی کم‌کم شلوغ‌تر شد.

امتحان‌ها، تکالیف، برنامه‌های خانوادگی و دوستی‌های تازه، فاصلهٔ میان تماس‌هایشان را بیشتر کرد.

یک هفته تماس نگرفتند.

بعد دو هفته.

بعد یک ماه.

آراد هر بار که به کشوی میزش نگاه می‌کرد، نامهٔ سام را به یاد می‌آورد. چند بار خواست تماس بگیرد، اما به خودش گفت حتماً سام مشغول است و بعداً فرصت پیدا می‌کنند.

گاهی هم سام پیام می‌داد و آراد پاسخ را به بعد موکول می‌کرد.

نه از روی بی‌علاقگی؛ فقط چون هر دو خیال می‌کردند فردا هم فرصت خواهند داشت.

سال اول گذشت.

تابستان بعدی رسید، اما خانوادهٔ سام نتوانستند به شهر ساحلی سفر کنند. آراد با پدر و مادرش به ساحل رفت و کنار فانوس دریایی نشست.

جایی که آن‌ها قول داده بودند هر تابستان برگردند.

او به سام پیام داد:

«امسال نتونستی بیای، ولی سال بعد حتماً.»

سام پاسخ داد:

«حتماً. قول.»

آراد به دریا نگاه کرد.

قول هنوز سر جایش بود.

اما زمان، بی‌صدا جلو می‌رفت.

سال دوم، سوم و چهارم هم گذشتند. آن‌ها گاهی پیام می‌دادند، گاهی تماس می‌گرفتند و گاهی ماه‌ها از هم خبر نداشتند.

آراد دبیرستان را تمام کرد و وارد دانشگاه شد. سام هم در رشتهٔ معماری پذیرفته شد؛ همان رشته‌ای که کنار فانوس دریایی درباره‌اش حرف زده بود.

یک روز، آراد عکسی از یک ساختمان عجیب برای سام فرستاد.

سام جواب داد:

«این یکی رو من طراحی نکردم! هنوز اون‌قدر معروف نشدم.»

آراد خندید و نوشت:

«پس عجله کن. من هنوز منتظرم با ماشین قدیمی‌ات بریم سفر.»

سام پاسخ داد:

«بالاخره می‌ریم.»

اما آن سفر هرگز در همان سال اتفاق نیفتاد.

مدت‌ها گذشت تا یک عصر پاییزی، آراد هنگام مرتب‌کردن اتاقش دوباره به نامه برخورد کرد.

کاغذ کمی زرد شده بود. گوشه‌هایش تا خورده بودند و خط سام همچنان همان‌قدر نامرتب بود.

آراد نامه را خواند و بعد تلفنش را برداشت.

شمارهٔ سام هنوز در فهرست مخاطبانش بود.

این بار منتظر فردا نماند.

تماس گرفت.

سام بعد از چند زنگ جواب داد.

«الو؟»

آراد برای لحظه‌ای ساکت ماند.

صدای سام کمی بم‌تر شده بود، اما همان حس آشنای سال‌های کودکی را داشت.

«سلام، رفیق.»

سام خندید.

«بالاخره یادت افتاد من وجود دارم؟»

آراد هم خندید.

«می‌دونم. خیلی وقت گذشته.»

آن‌ها مدت زیادی حرف زدند. از دانشگاه، کارهایشان، دوستان جدید و اتفاق‌هایی گفتند که در این سال‌ها برایشان افتاده بود.

در پایان تماس، آراد پرسید:

«هنوز اون صدف رو داری؟»

سام گفت:

«آره. توی یه جعبه نگهش داشتم.»

آراد به پنجره نگاه کرد.

«پس باید دوباره همدیگه رو ببینیم.»

سام پاسخ داد:

«این بار دیگه بهونه نداریم.»

آن‌ها برای تابستان بعد برنامه ریختند.

اما زندگی همیشه مطابق برنامه‌های ما پیش نمی‌رود.

چند ماه بعد، پدر سام بیمار شد و خانواده‌اش مدتی درگیر رفت‌وآمد به بیمارستان شدند. آراد از موضوع باخبر شد و مرتب برای سام پیام می‌فرستاد.

گاهی سام جواب می‌داد و گاهی فقط می‌نوشت:

«ممنون که هستی.»

آراد می‌خواست بیشتر کمک کند، اما نمی‌دانست چه کاری از دستش برمی‌آید. یک بار پیشنهاد داد به دیدنشان برود، ولی سام گفت فعلاً بهتر است صبر کند تا شرایط آرام‌تر شود.

آراد صبر کرد.

بعد از مدتی، حال پدر سام بهتر شد. زندگی کم‌کم به روال معمول برگشت و آن دو دوباره دربارهٔ دیدارشان صحبت کردند.

سرانجام، در آغاز تابستان، سام خبر داد که قرار است چند روزی به شهر ساحلی بیاید.

آراد از خوشحالی نتوانست جلوی لبخندش را بگیرد.

همان روز فهرست قدیمی تابستان را از میان دفترهایش پیدا کرد. کاغذ پر از خط‌خوردگی و لکه بود، اما هنوز می‌شد نوشته‌هایش را خواند.

او کنار مورد دهم، یعنی «قول دادن که هیچ‌وقت دوستی‌مان را فراموش نکنیم»، یک علامت تیک کشید.

«واقعاً نگهش داشتی.»

سام گفت:

    body: `
سامان همیشه عاشق داستان‌های مرموز بود. هر وقت کسی از خانه‌ای متروکه، صدایی عجیب یا اتفاقی توضیح‌ناپذیر حرف می‌زد، او با اشتیاق گوش می‌کرد و سعی می‌کرد راز ماجرا را پیدا کند.

تابستان آن سال، سامان همراه خانواده‌اش به شهر کوچکی کنار دریا رفت. خانهٔ عمه‌اش نزدیک ساحل بود و از پنجرهٔ اتاق مهمان می‌شد در دوردست، فانوس دریایی بلندی را دید.

فانوس روی صخره‌ای بزرگ قرار داشت. دیوارهایش سفید بودند، اما رطوبت دریا رنگ آن‌ها را به خاکستری تبدیل کرده بود. پنجره‌های کوچک برج سال‌ها بود که بسته مانده بودند و درِ آهنی آن زنگ زده بود.

عمهٔ سامان به او گفته بود که ساختمان مدت‌هاست تعطیل شده است.

یک شب، وقتی سامان کنار پنجره نشسته بود، نوری زردرنگ از بالای فانوس دریایی روشن شد.

نور چند بار چرخید و بعد خاموش شد.

سامان سریع مادرش را صدا زد.

«مامان! فانوس روشن شد!»

مادرش به پنجره نگاه کرد، اما چیزی ندید.

«شاید نور یک قایق بوده.»

سامان گفت:
«نه، از بالای برج بود. دقیقاً مثل فانوس دریایی.»

مادرش لبخندی زد و گفت:
«فردا روز شلوغی داریم. بهتره بخوابی.»

اما سامان تا صبح به آن نور فکر کرد.

روز بعد، از دوست محلی‌اش، پارسا، دربارهٔ فانوس پرسید.

پارسا وقتی نام آن را شنید، حالت صورتش عوض شد.

«بهتره شب‌ها نزدیکش نری.»

سامان با هیجان پرسید:
«چرا؟ چیزی درباره‌ش می‌دونی؟»

پارسا اطرافش را نگاه کرد و آهسته گفت:
«پدربزرگم می‌گه سال‌ها پیش، نگهبان فانوس یک شب ناپدید شده. از اون موقع، بعضی شب‌ها نورش روشن می‌شه، با اینکه برق ساختمان قطع شده.»

سامان خندید.

«حتماً یک مشکل برقیه.»

پارسا گفت:
«پس چرا هیچ‌کس حاضر نیست تعمیرش کنه؟»

سامان جوابی نداشت. همین موضوع باعث شد بیشتر کنجکاو شود.

آن عصر، او و پارسا تا نزدیکی فانوس دریایی رفتند. مسیر از میان علف‌های بلند و سنگ‌های خیس ساحل می‌گذشت. باد سردی می‌وزید و صدای موج‌ها از پایین صخره شنیده می‌شد.

وقتی به ساختمان رسیدند، سامان متوجه شد روی درِ آهنی قفلی قدیمی وجود دارد. کنار در، تابلویی نصب شده بود که نوشته‌هایش تقریباً پاک شده بودند.

پارسا گفت:
«همین‌جا کافیه. برگردیم.»

سامان دستگیره را امتحان کرد. در باز نشد، اما از داخل صدای تیک‌تاک آرامی شنید.

هر دو ساکت شدند.

تیک... تاک... تیک... تاک...

پارسا عقب رفت.

«این صدا رو شنیدی؟»

سامان گوشش را به در نزدیک کرد. صدا شبیه ساعت بزرگی بود که هنوز کار می‌کرد.

او گفت:
«شاید یک ساعت قدیمی داخل ساختمونه.»

پارسا دستش را گرفت و گفت:
«فردا توی روز برمی‌گردیم. الان بریم.»

آن‌ها به خانه برگشتند، اما سامان تصمیمش را گرفته بود. می‌خواست بفهمد داخل فانوس چه خبر است.

صبح روز بعد، عمهٔ سامان متوجه شد که او مدام به برج نگاه می‌کند.

عمه گفت:
«دنبال چی می‌گردی؟»

سامان ماجرا را تعریف کرد.

عمه مدتی سکوت کرد و سپس گفت:
«من بچه که بودم، یک پیرمرد به اسم آقای راد در اون فانوس کار می‌کرد. هر شب چراغ رو روشن می‌کرد تا کشتی‌ها راهشون رو پیدا کنن. یک شب طوفان شدیدی اومد و بعد از اون، دیگه کسی ندیدش.»

سامان پرسید:
«یعنی هیچ‌وقت پیداش نکردن؟»

«نه. فقط دفترچه‌ای ازش باقی موند که بعداً به شهرداری تحویل دادن.»

سامان با اصرار از عمه خواست کمکش کند دفترچه را پیدا کند. عمه ابتدا مخالفت کرد، اما سرانجام پذیرفت با یکی از کارکنان قدیمی بندر تماس بگیرد.

چند ساعت بعد، آن‌ها به خانهٔ پیرمردی رفتند که زمانی در نگهداری فانوس دریایی همکاری کرده بود. پیرمرد جعبه‌ای از کمد بیرون آورد و دفترچه‌ای چرمی به سامان نشان داد.

روی نخستین صفحه نوشته شده بود:

«اگر نور دوباره روشن شد، پیش از طلوع آفتاب به برج بروید و ساعت را متوقف کنید.»

سامان صفحه‌های بعدی را ورق زد. بیشتر نوشته‌ها دربارهٔ وضعیت هوا و کشتی‌هایی بود که از ساحل عبور می‌کردند. اما در آخرین صفحه، جمله‌ای با خطی لرزان نوشته شده بود:

«نور بدون برق روشن شده است. صدای ساعت از اتاق زیرین می‌آید. کسی در برج نیست، اما هر شب صدای قدم‌ها بلندتر می‌شود.»

سامان احساس کرد قلبش تندتر می‌زند.

پیرمرد گفت:
«آقای راد به ساعت بزرگی اشاره کرده بود که در زیرزمین قرار داشت. بعد از ناپدیدشدنش، هیچ‌کس جرئت نکرد آن را بررسی کند.»

آن شب، سامان و پارسا همراه عمهٔ سامان دوباره به فانوس دریایی رفتند. این بار چراغ‌قوه داشتند و از قبل با مسئول بندر هماهنگ کرده بودند تا در صورت نیاز کمکشان کند.

درِ آهنی با کلید قدیمی باز شد.

داخل ساختمان بوی نم و چوب کهنه می‌آمد. پلکانی مارپیچ تا بالای برج ادامه داشت. کنار دیوار، جعبه‌های خالی و وسایل زنگ‌زده روی هم انباشته شده بودند.

صدای تیک‌تاک از پایین ساختمان می‌آمد.

آن‌ها چراغ‌قوه‌ها را به سمت راهروی باریکی گرفتند که قبلاً پشت قفسه‌ها پنهان شده بود. انتهای راهرو دری چوبی قرار داشت.

سامان در را باز کرد.

اتاقی کوچک زیر برج بود. وسط آن، ساعت بزرگی با چرخ‌دنده‌های برنجی قرار داشت. عقربه‌های ساعت روی دوازده متوقف شده بودند، اما چرخ‌دنده‌ها آرام حرکت می‌کردند.

پارسا گفت:
«این غیرممکنه!»

کنار ساعت، جعبه‌ای فلزی وجود داشت. داخل جعبه چند صفحهٔ قدیمی و یک یادداشت دیگر بود.

سامان یادداشت را باز کرد:

«اگر کسی این نوشته را می‌خواند، بداند که چراغ فانوس با ساعت هماهنگ است. وقتی ساعت به نیمه‌شب برسد، نور روشن می‌شود. برای خاموش کردن آن، اهرم اصلی را پایین بکشید.»

سامان اطراف ساعت را بررسی کرد و اهرمی آهنی پیدا کرد. آن را پایین کشید.

صدای تیک‌تاک ناگهان متوقف شد.

در همان لحظه، نور زردی از بالای برج تابید و سپس خاموش شد.

همه از جا پریدند.

عمهٔ سامان گفت:
«باید بریم بالا و ببینیم چه اتفاقی افتاده.»

آن‌ها از پله‌ها بالا رفتند. در اتاق چراغ، دستگاه بزرگی قرار داشت که ظاهراً سال‌ها بدون برق کار کرده بود. با پایین کشیدن اهرم، چرخش آن متوقف شده بود.

روی دیوار، پشت دستگاه، نوشته‌ای دیده می‌شد:

«برای کسانی که راه را گم کرده‌اند.»

پیرمردی که دفترچه را به آن‌ها داده بود، روز بعد دستگاه را بررسی کرد. او توضیح داد که احتمالاً ساعت با یک سازوکار مکانیکی قدیمی کار می‌کرده و بخشی از آن در گذر زمان آسیب دیده بود. این توضیح، بخش زیادی از ماجرا را روشن کرد، هرچند کسی نمی‌دانست چرا دستگاه دقیقاً همان شب دوباره فعال شده بود.

چند روز بعد، مسئولان شهر تصمیم گرفتند فانوس دریایی را تعمیر کنند و آن را به موزه‌ای کوچک تبدیل کنند.

سامان پیش از بازگشت به خانه، یک بار دیگر به برج نگاه کرد.

این بار هیچ نوری از پنجره‌ها بیرون نمی‌آمد.

او لبخندی زد و به پارسا گفت:
«بالاخره راز فانوس رو پیدا کردیم.»

پارسا جواب داد:
«تقریباً.»

سامان با تعجب پرسید:
«یعنی چی تقریباً؟»

پارسا به بالای برج اشاره کرد.

در پنجرهٔ آخر، برای یک لحظه نور کوچکی روشن شد.

بعد همه‌چیز دوباره تاریک شد.
`
},

    title: "مدیر یک‌روزهٔ مدرسه",
    genre: "طنز",
